enha rosto, cabelo, proporções e roupa idênticos.\n\nVídeo vertical 9:16, 10 segundos, animação 3D cinematográfica.\nCena: sala de casa, LUQUINHA sentado no chão diante de uma caixa de papelão lisa, sem nenhum logotipo.\n0–4 s: ele abre a caixa com empolgação, uma luz azul sai de dentro.\n4–7 s: tira lá de dentro um tênis de corrida novo e uma garrafa de água, olhando maravilhado.\n7–10 s: levanta o tênis para a câmera e fala.\nFala (português do Brasil, voz masculina adulta, empolgado): &quot;Onze do onze, parceiro! Os achadinhos tão nos stories!&quot;\nCâmera: plano médio, push-in na abertura da caixa.\nÁudio: fita adesiva rasgando, som mágico de brilho, música animada.\nSem legendas, sem texto na tela, sem marcas d&#39;água, sem logotipos de marca.\n\u003c/code>\u003c/pre>\n"},"L5":{"title":"Lista VIP i9 (16 a 29/11)","html":"\u003cpre>\u003ccode>IDENTITYLOCK\nUse a imagem anexada (luquinha.png) como referência exata do personagem LUQUINHA: mascote 3D estilo boneco colecionável, cabeça grande, cabelo cacheado castanho-escuro, barba curta, olhos claros, rosto redondo, físico forte, camiseta preta com o logo i9 no peito, short preto, tênis preto e rosa, smartwatch e pulseira rosa com checks brancos. Mantenha rosto, cabelo, proporções e roupa idênticos.\n\nVídeo vertical 9:16, 10 segundos, animação 3D cinematográfica.\nCena: entrada de uma festa exclusiva, com corda de veludo azul e luzes azuis, à noite. LUQUINHA está de segurança na porta, braços cruzados, segurando uma prancheta.\n0–4 s: ele olha a prancheta, depois levanta os olhos para a câmera, desconfiado.\n4–7 s: abre um sorriso, solta a corda de veludo e faz sinal para entrar.\n7–10 s: fala para a câmera.\nFala (português do Brasil, voz masculina adulta, divertido): &quot;Seu nome tá na lista VIP da i9? Não? Manda I9 no direct, parceiro!&quot;\nCâmera: plano médio fixo.\nÁudio: música de festa abafada ao fundo, som da corda de veludo.\nSem legendas, sem texto na tela, sem marcas d&#39;água.\n\u003c/code>\u00 CK: mesmo rosto, cabelo, barba, expressão e corpo). Recorte do peito para cima e posicione entre 1000 px e 1570 px, centralizado.\nFundo preto #0B0B0B com um brilho radial grafite atrás da pessoa e um ícone de sinal de rede (quatro barras crescentes) em neon verde-limão, grande e com 25% de opacidade, atrás dos ombros.\n\nTexto entre 280 px e 900 px (Montserrat Black, caixa alta, branco, centralizado):\n&quot;TIM COM O LUCAS&quot;\nA palavra &quot;LUCAS&quot; em verde-limão #C8F542.\nTexto de apoio (Montserrat SemiBold, branco):\n&quot;Recarga pré-paga e plano TIM Controle. Atendimento direto comigo, sem fila e sem robô.&quot;\n\nLogo i9 pequeno no canto inferior direito, acima dos 350 px da base.\nNada nos 250 px do topo nem nos 350 px da base. Sem nenhum logotipo de operadora.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>No Instagram:\u003c/strong> sem sticker. Se tiver o logo oficial da TIM, cole pequeno acima do título.\u003c/p>\n"},"T2":{"title":"Recarga pré-paga","html":"\u003cp>Foto: \u003ccode>1 (44).jpeg\u003c/code>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nPróxima arte. T2 de 8, mesmo estilo e mesma cor.\n\nUse a foto anexada (1 (44).jpeg): selfie da pessoa, exatamente como está (IDENTITYLOCK). Coloque a foto dentro de uma moldura de smartphone preto, vertical, levemente inclinada para a direita, entre 950 px e 1570 px.\nFundo preto. Acima da moldura, um ícone grande de raio em verde-limão neon, como se estivesse carregando.\n\nTexto entre 280 px e 850 px (Montserrat Black, caixa alta, branco):\n&quot;FICOU SEM CRÉDITO?&quot;\nA palavra &quot;CRÉDITO&quot; em verde-limão.\nTexto de apoio (Montserrat SemiBold, branco):\n&quot;Eu faço sua recarga TIM pré-paga na hora. Você não sai de casa e não precisa de aplicativo.&quot;\nSelo (fundo verde-limão, texto preto, Montserrat Black): &quot;MANDA RECARGA NO DIRECT&quot;\n\nNada nos 250 px do topo nem nos 350 px da base. Sem nenhum logotipo de operadora.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>No Instagram:\u003c/strong> sticker de enquete &quot;Seu crédito costuma acabar antes do mês? SEMPRE 😩 / ÀS VEZES&quot;.\u003c/p>\n"},"T3":{"title":"TIM Controle","html":"\u003cp>Foto: \u003ccode>1 (49).jpeg\u003c/code>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nPróxima arte. T3 de 8, mesmo estilo e mesma cor.\n\nUse a foto anexada (1 (49).jpeg): a pessoa com expressão de &quot;e aí?&quot;, exatamente como está (IDENTITYLOCK: mesmo rosto, expressão e corpo). Escureça o fundo, mantendo o rosto natural. Recorte do peito para cima e posicione entre 1000 px e 1570 px.\nFundo preto. Ao lado dele, flutuando, uma fatura estilizada em linha verde-limão com um cadeado fechado em cima, representando valor fixo.\n\nTexto entre 280 px e 900 px (Montserrat Black, caixa alta, branco):\n&quot;CONTA FIXA. SEM SUSTO NO FIM DO MÊS.&quot;\nA palavra &quot;FIXA&quot; em verde-limão.\nTexto de apoio (Montserrat SemiBold, branco):\n&quot;No TIM Controle você paga o mesmo valor todo mês, com internet e ligações no pacote.&quot;\nSelo (fundo verde-limão, texto preto, Montserrat Black): &quot;MANDA CONTROLE NO DIRECT&quot;\n\nNada nos 250 px do topo nem nos 350 px da base. Sem nenhum logotipo de operadora.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>No Instagram:\u003c/strong> slider com emoji 😤 e a pergunta &quot;Quanto você odeia surpresa na conta?&quot;.\u003c/p>\n"},"T4":{"title":"Pré-pago ou Controle? (comparativo)","html":"\u003cp>Fotos: nenhuma\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nPróxima arte. T4 de 8, mesmo estilo e mesma cor.\n\nFundo preto com uma linha vertical verde-limão neon dividindo a arte ao meio, entre 450 px e 1500 px de altura.\nNo topo, centralizado, entre 280 px e 420 px (Montserrat Black, caixa alta, branco): &quot;QUAL É O SEU?&quot;\n\nColuna da esquerda, com ícone de linha verde-limão de um raio no alto:\nTítulo (Montserrat Black, branco): &quot;PRÉ-PAGO&quot;\nLista (Montserrat SemiBold, branco, uma linha cada, com um pequeno check verde-limão antes):\n&quot;Recarrega quando quiser&quot;\n&quot;Sem conta mensal&quot;\n&quot;Bom pra quem usa pouco&quot;\n\nColuna da direita, com ícone de linha verde-limão de um cadeado no alto:\nTítulo (Montserrat Black, branco): &quot;CONTROLE&quot;\nLista:\n&quot;Valor fixo todo mês&quot;\n&quot;Internet e ligações no pacote&quot;\n&quot;Bom pra quem usa todo dia&quot;\n\nEmbaixo, centralizado, entre 1400 px e 1550 px (Montserrat SemiBold, cinza #BDBDBD): &quot;Na dúvida, me chama que eu te ajudo a escolher.&quot;\nNada nos 250 px do topo nem nos 350 px da base. Sem nenhum logotipo de operadora.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>No Instagram:\u003c/strong> sticker de enquete &quot;Você é: PRÉ-PAGO / CONTROLE&quot;.\u003c/p>\n"},"T5":{"title":"Como funciona em 3 passos","html":"\u003cp>Fotos: nenhuma\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nPróxima arte. T5 de 8, mesmo estilo e mesma cor.\n\nFundo preto. Um caminho vertical tracejado em verde-limão neon ligando 3 círculos numerados (1, 2, 3), alinhados à esquerda, entre 520 px e 1450 px. Cada círculo tem o número em Montserrat Black preto sobre fundo verde-limão.\n\nTítulo entre 280 px e 440 px (Montserrat Black, caixa alta, branco): &quot;COMO FUNCIONA&quot;\n\nAo lado de cada círculo, primeira frase em Montserrat Black e segunda em Montserrat SemiBold, branco:\n1: &quot;Manda RECARGA ou CONTROLE no direct.&quot; / &quot;Pode ser agora.&quot;\n2: &quot;Me passa o número e o que você precisa.&quot; / &quot;Eu te mostro as opções do dia.&quot;\n3: &quot;Escolheu? Eu cuido do resto.&quot; / &quot;Você recebe a confirmação.&quot;\n\nNada nos 250 px do topo nem nos 350 px da base. Sem nenhum logotipo de operadora.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>No Instagram:\u003c/strong> sticker de link para o seu WhatsApp de vendas, com o texto &quot;Chamar no WhatsApp&quot;.\u003c/p>\n"},"T6":{"title":"Dúvidas frequentes","html":"\u003cp>Foto: \u003ccode>1 (3).jpg\u003c/code>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nPróxima arte. T6 de 8, mesmo estilo e mesma cor.\n\nUse a foto anexada (1 (3).jpg): a pessoa de camiseta preta olhando para o lado, pensativa, exatamente como está (IDENTITYLOCK). Posicione do peito para cima no canto inferior direito, entre 1150 px e 1570 px.\nFundo preto com pontos de interrogação em linha fina verde-limão, com baixa opacidade.\n\nTítulo entre 280 px e 420 px (Montserrat Black, caixa alta, branco): &quot;DÚVIDAS&quot;\nDuas perguntas e respostas, alinhadas à esquerda, entre 480 px e 1100 px:\nPergunta (Montserrat Black, verde-limão): &quot;Sou de outra operadora. Perco meu número?&quot;\nResposta (Montserrat SemiBold, branco): &quot;Não. Com a portabilidade você leva o seu número.&quot;\nPergunta (Montserrat Black, verde-limão): &quot;Já sou TIM pré-pago. Posso ir pro Controle?&quot;\nResposta (Montserrat SemiBold, branco): &quot;Pode. Me chama que eu te passo o caminho.&quot;\n\nNada nos 250 px do topo nem nos 350 px da base. Sem nenhum logotipo de operadora.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>No Instagram:\u003c/strong> caixinha de perguntas &quot;Outra dúvida sobre seu plano? Pergunta aqui&quot;.\u003c/p>\n"},"T7":{"title":"Quem já fez (moldura para prints de clientes)","html":"\u003cp>Fotos: nenhuma\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nPróxima arte. T7 de 8, mesmo estilo e mesma cor.\n\nFundo preto. No centro, entre 480 px e 1400 px, um quadro vazio com cantos arredondados, fundo grafite #1C1C1E e borda verde-limão com brilho neon. Deixe o quadro totalmente vazio: é onde vou colar o print da conversa com o cliente.\nTítulo entre 280 px e 430 px (Montserrat Black, caixa alta, branco): &quot;QUEM JÁ FEZ COMIGO&quot;\nA palavra &quot;COMIGO&quot; em verde-limão.\nAbaixo do quadro (Montserrat SemiBold, cinza): &quot;print publicado com autorização&quot;\nNada nos 250 px do topo nem nos 350 px da base. Sem nenhum logotipo de operadora.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>No Instagram:\u003c/strong> cole o print de um cliente que autorizou, \u003cstrong>com nome e número de telefone cobertos\u003c/strong>. Use uma cópia desta moldura para cada print real. Enquanto não tiver nenhum, pule esta arte.\u003c/p>\n"},"T8":{"title":"Chamada final com o LUQUINHA","html":"\u003cp>Foto: \u003ccode>luquinha.png\u003c/code>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nPróxima arte. T8 de 8, mesmo estilo e mesma cor.\n\nUse a imagem anexada (luquinha.png): o mascote LUQUINHA exatamente como está (IDENTITYLOCK: mesma cabeça grande, cabelo cacheado, barba, olhos claros, roupa, pulseira e proporções). Posicione de corpo inteiro entre 900 px e 1570 px, apontando para cima com o dedo indicador e sorrindo, segurando um smartphone com a tela acesa em verde-limão (sem texto na tela).\nFundo preto com raios de luz verde-limão saindo de trás dele.\n\nTexto entre 280 px e 820 px (Montserrat Black, caixa alta, branco):\n&quot;BORA, PARCEIRO!&quot;\nTexto de apoio (Montserrat SemiBold, branco): &quot;Recarga ou plano novo, é só chamar.&quot;\nSelo (fundo verde-limão, texto preto, Montserrat Black): &quot;MANDA RECARGA OU CONTROLE NO DIRECT&quot;\n\nNada nos 250 px do topo nem nos 350 px da base. Sem nenhum logotipo de operadora.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>No Instagram:\u003c/strong> sticker de link do WhatsApp de vendas. Se preferir vídeo, use no lugar o clipe L3 do LUQUINHA (&quot;a internet acabou no meio do treino&quot;), que está no arquivo \u003ccode>02-stories-afiliados-i9.md\u003c/code>.\u003c/p>\n"}},"routine":{"0":{"theme":"\u003cstrong>Domingo i9\u003c/strong>","html":"Até 15/11: bastidor da construção da plataforma + enquete &quot;o que você quer ver na i9?&quot;. A partir de 16/11: arte Lista VIP (S4) + contador de inscritos (&quot;já são X na lista&quot;)."},"1":{"theme":"Bastidor + Reels","html":"1. Clipe &quot;Bom dia, segunda&quot; do LUQUINHA (L1) ou vídeo seu chegando no treino. 2. Enquete sobre o tema do Reels do dia. 3. Às 19h30, repost do Reels com &quot;post novo 👇&quot;."},"2":{"theme":"Caixinha","html":"1. Bastidor do dia. 2. Arte Caixinha (S5) com pergunta do tema da semana. 3. Respostas de 2 ou 3 perguntas no mesmo dia ou no dia seguinte."},"3":{"theme":"\u003cstrong>Dia TIM\u003c/strong>","html":"Sequência do destaque TIM (T1 a T8, na aba Bio e destaques), 3 ou 4 artes por vez. CTA \u003ccode>manda CONTROLE\u003c/code> ou \u003ccode>manda RECARGA\u003c/code>."},"4":{"theme":"Quiz + Reels","html":"1. Quiz com uma pergunta do conteúdo da semana. 2. Repost do Reels. 3. Bastidor do treino."},"5":{"theme":"\u003cstrong>Sextou do achadinho\u003c/strong> (Mercado Livre)","html":"1. Arte Achadinho (S1) com o produto. 2. Vídeo seu usando o produto (10 s). 3. Story com sticker de link + \u003ccode>link de afiliado\u003c/code>. 4. Enquete &quot;Já tem um desses?&quot;"},"6":{"theme":"Treino / corrida","html":"Bastidor do treino ou corrida ao vivo, clipe do LUQUINHA quando tiver Reels dele, foto com o pessoal."}},"kit":[{"title":"Instruções do projeto no ChatGPT (cole uma vez)","html":"\u003cp>Em \u003cstrong>Instruções do projeto\u003c/strong>, cole o texto abaixo inteiro:\u003c/p>\n\u003cpre>\u003ccode>Você é o diretor de arte da marca i9 e do perfil @lucasherculiani (Lucas Herculiani, Marília-SP, estudante de Educação Física, treina cross, corrida e musculação). Toda imagem que eu pedir segue estas regras, mesmo que eu não repita:\n\nCOMANDO IDENTITYLOCK\nQuando o prompt contiver IDENTITYLOCK: preserve 100% o rosto, a identidade, o formato da cabeça, o cabelo, a barba, a cor dos olhos, o tom de pele e o tipo físico da pessoa das fotos anexadas e das fotos de referência do projeto. Não rejuvenesça, não emagreça, não deixe mais musculoso, não troque traços, não &quot;embeleze&quot;. Pode mudar luz, cenário, cor e enquadramento; o rosto nunca muda. Se a cena exigir algo que deformaria o rosto, simplifique a cena e mantenha o rosto. O mesmo vale para o mascote LUQUINHA (arquivo luquinha.png): mesma cabeça grande, cabelo cacheado, barba, olhos claros, roupa e proporções.\n\nFORMATOS\n- Feed (post único e carrossel): quadrado 1:1, 1080x1080. Mantenha textos e logo dentro da área central, deixando 140 px livres em cada lateral (o grid do Instagram corta as laterais).\n- Story, capa de Reels e arte vertical: 9:16, 1080x1920. Nenhum texto, logo ou elemento importante nos 250 px do topo nem nos 350 px da base.\n\nTIPOGRAFIA\n- Só Montserrat ou Poppins. Títulos em Montserrat Black (ou Poppins ExtraBold), caixa alta, entrelinha apertada. Apoio em Montserrat SemiBold ou Poppins Medium.\n- Escreva exatamente o texto que eu passar entre aspas, em português do Brasil, com todos os acentos. Não invente texto extra, não traduza, não adicione palavras em inglês.\n- Uma palavra-chave do título vai na cor de destaque. O resto em branco.\n\nPALETA\n- Fixas: preto #0B0B0B, grafite #1C1C1E, branco #FFFFFF, cinza #BDBDBD.\n- OUTUBRO ROSA (até 31/10): destaque rosa neon #FF2D95, apoio #FF8CC6.\n- NOVEMBRO AZUL (01 a 30/11): destaque azul #1E8BFF, degradê #6BB8FF a #0A4FC4.\n- Eu sempre digo no prompt qual paleta usar.\n\nESTILO\nFotografia de academia dramática, cinematográfica, alto contraste, fundo escuro, luz de recorte, leve granulação, cor de destaque aparecendo em luzes, neon, faixas, contornos e elementos gráficos (como as referências de estilo do projeto, porém mais limpo e mais moderno). Nada de visual de banco de imagens, nada de modelos genéricos.\n- Layout A (escuro): fundo preto/grafite, foto em destaque, cor só em detalhes.\n- Layout B (colorido): blocos, faixas ou fundo na cor de destaque, foto recortada por cima.\n\nLOGO i9\nUse o logo exatamente como no manual do mês (i minúsculo claro + 9 na cor de destaque, retos, colados). Nunca redesenhe as letras. Em cada arte eu peço uma aplicação criativa (neon na parede, gravado em anilha, na tela do relógio, medalha etc.). Quando eu não pedir nada, coloque o logo pequeno no rodapé central, dentro da área segura.\n\nASSINATURA\nEm todo feed, @lucasherculiani pequeno em Montserrat SemiBold, cinza #BDBDBD, perto do logo.\n\nAntes de gerar, não me faça perguntas: gere direto. Se eu disser &quot;próximo slide&quot;, mantenha exatamente o mesmo estilo, fonte, cores e posição do logo do slide anterior.\n\u003c/code>\u003c/pre>\n"},{"title":"Template da capa dos Reels","html":"\u003cp>Todas as capas de Reels seguem o mesmo padrão para unificar o grid. No calendário, cada Reels traz só a foto e o título; você cola este template trocando as duas linhas marcadas.\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nCapa de Reels vertical 9:16, 1080x1920, seguindo o Kit i9 do projeto.\nFoto anexada: use a pessoa exatamente como está (IDENTITYLOCK), recortada e posicionada do meio para baixo, ocupando cerca de 60% da altura, com fundo trocado por grafite escuro com luz de recorte na cor de destaque.\nFaixa diagonal suave na cor de destaque atravessando a imagem logo acima da linha dos ombros.\nTítulo em Montserrat Black, caixa alta, branco, máximo 3 linhas, centralizado entre 520 px e 980 px de altura (dentro da área central do quadrado, para a capa funcionar também no grid 1:1): TÍTULO AQUI\nDestaque a palavra PALAVRA AQUI na cor de destaque.\nLogo i9 pequeno no centro, a 400 px da base.\nPaleta: OUTUBRO ROSA ou NOVEMBRO AZUL (conforme a data).\nNada de texto nos 250 px do topo nem nos 350 px da base.\n\u003c/code>\u003c/pre>\n"},{"title":"Configuração do Google AI Studio (vídeos do LUQUINHA)","html":"\u003col>\n\u003cli>Acesse aistudio.google.com → \u003cstrong>Generate media\u003c/strong> → modelo de vídeo (Veo).\u003c/li>\n\u003cli>Em cada geração, anexe \u003ccode>luquinha.png\u003c/code> como \u003cstrong>imagem de referência / primeiro quadro\u003c/strong>. Isso segura a aparência do mascote entre um clipe e outro.\u003c/li>\n\u003cli>Proporção \u003cstrong>9:16\u003c/strong>, duração \u003cstrong>10 s\u003c/strong> (cada prompt do calendário já está escrito em blocos de 10 s; vídeo com mais de 10 s = mais de um prompt, gerados na ordem e unidos no CapCut).\u003c/li>\n\u003cli>Os prompts pedem \u003cstrong>sem legenda e sem texto na tela\u003c/strong>: o vídeo de IA costuma errar letra. Você coloca os textos no CapCut, em Montserrat ou Poppins, dentro da área segura.\u003c/li>\n\u003cli>Se a voz sair estranha, gere de novo ou grave você mesmo a fala por cima (combina com a ideia de que o LUQUINHA é a sua versão boneco).\u003c/li>\n\u003c/ol>\n\u003cp>Descrição fixa do LUQUINHA (já está dentro de cada prompt, guarde para ajustes):\u003c/p>\n\u003cblockquote>\n\u003cp>Mascote 3D estilo boneco colecionável, cabeça grande, cabelo cacheado castanho-escuro, barba curta, olhos claros, rosto redondo, físico forte. Camiseta preta com o logo i9 no peito, short preto, tênis preto e rosa, smartwatch e pulseira rosa com checks brancos. Animação estilo filme 3D de estúdio, expressivo, iluminação cinematográfica.\u003c/p>\n\u003c/blockquote>\n"},{"title":"Regras dos Stories","html":"\u003cul>\n\u003cli>\u003cstrong>4 a 7 Stories por dia\u003c/strong>, sempre com pelo menos 1 interação (enquete, quiz, caixinha, slider ou reação).\u003c/li>\n\u003cli>Arte vertical \u003cstrong>1080x1920\u003c/strong>. Nenhum texto, sticker ou link nos \u003cstrong>250 px do topo\u003c/strong> e nos \u003cstrong>350 px da base\u003c/strong>.\u003c/li>\n\u003cli>Fonte no Instagram: use a fonte &quot;Moderno&quot; ou &quot;Forte&quot;, que são as mais próximas de Montserrat/Poppins. Nas artes geradas, sempre Montserrat ou Poppins.\u003c/li>\n\u003cli>\u003cstrong>Mercado Livre:\u003c/strong> todo Story com link leva o texto \u003ccode>link de afiliado\u003c/code> visível, perto do sticker de link. Comissão nunca é escondida.\u003c/li>\n\u003cli>\u003cstrong>TIM:\u003c/strong> você vende, então fale como vendedor: &quot;eu faço a sua recarga&quot;, &quot;eu te passo os planos&quot;. Não cite preço sem conferir a tabela do dia.\u003c/li>\n\u003cli>\u003cstrong>i9:\u003c/strong> CTA sempre \u003ccode>manda I9 no direct\u003c/code>. Não use &quot;link na bio&quot;.\u003c/li>\n\u003cli>Toda sexta à noite, salve os melhores Stories da semana nos destaques: \u003cstrong>Comece aqui\u003c/strong>, \u003cstrong>i9\u003c/strong>, \u003cstrong>Achadinhos\u003c/strong>, \u003cstrong>TIM\u003c/strong>, \u003cstrong>Corrida\u003c/strong>, \u003cstrong>Bastidores\u003c/strong>.\u003c/li>\n\u003c/ul>\n"}]};
  var YEAR = 2026, MONTH = 10; // novembro (0 = janeiro)
  var DOW = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
  var DOW_SHORT = ["D", "S", "T", "Q", "Q", "S", "S"];
  var KIND = { reels: "Reels", carrossel: "Carrossel", post: "Post", stories: "Só Stories" };
  var daysInMonth = new Date(YEAR, MONTH + 1, 0).getDate();
  var firstDow = new Date(YEAR, MONTH, 1).getDay();
  var now = new Date();
  var todayN = now.getFullYear() === YEAR && now.getMonth() === MONTH ? now.getDate() : null;
  var grid = document.getElementById("grid"), sheet = document.getElementById("sheet"), kitBtn = document.getElementById("kit-btn");
  var selected = null;

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function storyTags(d) {
    var s = DATA.stories[d], t = [];
    if (!s) return t;
    var txt = s.html.replace(/<[^>]+>/g, " ");
    if (/TIM/.test(txt)) t.push("TIM");
    if (/achadinho|Mercado Livre|11\.11/i.test(txt)) t.push("ML");
    if (/\bi9\b/.test(txt)) t.push("i9");
    return t;
  }

  // Calendário
  DOW_SHORT.forEach(function (l, i) { var h = document.createElement("div"); h.className = "dow"; h.textContent = l; h.title = DOW[i]; grid.appendChild(h); });
  for (var e = 0; e < firstDow; e++) { var x = document.createElement("div"); x.className = "empty"; grid.appendChild(x); }
  for (var d = 1; d <= daysInMonth; d++) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "day"; b.dataset.day = d; b.setAttribute("role", "gridcell");
    if (todayN && d < todayN) b.classList.add("past");
    if (d === todayN) b.classList.add("today");
    var n = document.createElement("span"); n.className = "n"; n.textContent = d; b.appendChild(n);
    var tags = document.createElement("span"); tags.className = "tags";
    (DATA.feed[d] || []).forEach(function (p) {
      if (p.kind === "stories") return;
      var t = document.createElement("i"); t.className = "tag " + (p.luquinha ? "lq" : "feed"); t.textContent = KIND[p.kind]; tags.appendChild(t);
    });
    storyTags(d).forEach(function (s) { var t = document.createElement("i"); t.className = "tag sub"; t.textContent = s; tags.appendChild(t); });
    b.appendChild(tags);
    if (DATA.stories[d] && DATA.stories[d].special) { var st = document.createElement("span"); st.className = "star"; st.textContent = "★"; st.setAttribute("aria-hidden", "true"); b.appendChild(st); }
    var feedNames = (DATA.feed[d] || []).map(function (p) { return KIND[p.kind]; }).join(", ");
    b.setAttribute("aria-label", DOW[new Date(YEAR, MONTH, d).getDay()] + ", " + d + " de novembro" + (feedNames ? ": " + feedNames : ""));
    b.addEventListener("click", (function (day) { return function () { openDay(day, true); }; })(d));
    grid.appendChild(b);
  }

  // Blocos de código com botão Copiar
  function kindOf(pre) {
    var prev = pre.closest(".block") ? null : pre.previousElementSibling;
    var label = prev ? prev.textContent.toLowerCase() : "";
    var code = pre.textContent.trim();
    if (code.indexOf("Você é o diretor de arte") === 0) return "Instruções do projeto · ChatGPT";
    if (code.indexOf("IDENTITYLOCK. Anime") === 0) return "Prompt de vídeo · CapCut";
    if (code.indexOf("Vídeo vertical") > -1) return "Prompt de vídeo · Google AI Studio";
    if (code.indexOf("IDENTITYLOCK") > -1) return "Prompt de imagem · ChatGPT";
    if (label.indexOf("legenda") > -1 || /\n#[a-z]/.test(code)) return "Legenda";
    return "Texto";
  }
  function copyText(btn, text, pre) {
    function ok() { btn.textContent = "Copiado"; btn.classList.add("done"); setTimeout(function () { btn.textContent = "Copiar"; btn.classList.remove("done"); }, 1600); }
    function fallback() {
      var r = document.createRange(); r.selectNodeContents(pre);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      try { if (document.execCommand("copy")) { ok(); return; } } catch (e) {}
      btn.textContent = "Selecionado: use Ctrl+C";
    }
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
  }
  function enhance(root) {
    root.querySelectorAll("table").forEach(function (t) { if (t.parentNode.classList.contains("tbl")) return; var w = document.createElement("div"); w.className = "tbl"; t.parentNode.insertBefore(w, t); w.appendChild(t); });
    root.querySelectorAll("pre").forEach(function (pre) {
      if (pre.parentNode.classList.contains("block")) return;
      var kind = kindOf(pre);
      var box = document.createElement("div"); box.className = "block";
      var bar = document.createElement("div"); bar.className = "bar";
      var k = document.createElement("span"); k.className = "kind"; k.textContent = kind;
      var btn = document.createElement("button"); btn.className = "copy"; btn.type = "button"; btn.textContent = "Copiar";
      bar.appendChild(k); bar.appendChild(btn);
      pre.parentNode.insertBefore(box, pre); box.appendChild(bar); box.appendChild(pre);
      btn.addEventListener("click", function () { copyText(btn, pre.textContent.replace(/\n$/, ""), pre); });
    });
  }
  function el(tag, cls, html) { var x = document.createElement(tag); if (cls) x.className = cls; if (html != null) x.innerHTML = html; return x; }

  // Ficha do dia
  function openDay(d, scroll) {
    selected = d; kitBtn.setAttribute("aria-pressed", "false");
    grid.querySelectorAll(".day").forEach(function (b) { b.setAttribute("aria-selected", +b.dataset.day === d ? "true" : "false"); });
    var dow = new Date(YEAR, MONTH, d).getDay();
    sheet.innerHTML = "";

    var head = el("div", "sheet-head");
    head.appendChild(el("h2", null, DOW[dow] + ", " + pad(d) + "/11" + (d === todayN ? ' <span style="color:var(--lime)">· hoje</span>' : "")));
    var nav = el("div", "nav");
    var prev = el("button", "btn", "← " + (d > 1 ? pad(d - 1) : "")); prev.type = "button"; prev.disabled = d === 1; prev.setAttribute("aria-label", "Dia anterior");
    var next = el("button", "btn", (d < daysInMonth ? pad(d + 1) : "") + " →"); next.type = "button"; next.disabled = d === daysInMonth; next.setAttribute("aria-label", "Próximo dia");
    prev.addEventListener("click", function () { openDay(d - 1, false); });
    next.addEventListener("click", function () { openDay(d + 1, false); });
    nav.appendChild(prev); nav.appendChild(next); head.appendChild(nav);
    sheet.appendChild(head);

    // Feed
    sheet.appendChild(el("div", "section-label", "No feed"));
    var posts = (DATA.feed[d] || []).filter(function (p) { return p.kind !== "stories"; });
    if (!posts.length) sheet.appendChild(el("p", "none", "Sem post no feed hoje. Foque nos Stories."));
    posts.forEach(function (p) {
      var c = el("article", "card");
      c.appendChild(el("div", "meta", p.head));
      c.appendChild(el("h3", null, p.title));
      c.appendChild(el("div", "doc", p.html));
      sheet.appendChild(c);
    });

    // Stories
    sheet.appendChild(el("div", "section-label", "Nos Stories"));
    var s = DATA.stories[d], r = DATA.routine[dow];
    var sc = el("div", "card");
    sc.appendChild(el("div", "meta", (r ? r.theme.replace(/<[^>]+>/g, "") : DOW[dow]) + (s && s.special ? " · dia especial ★" : "")));
    sc.appendChild(el("div", "doc", s ? "<p>" + s.html + "</p>" : '<p class="none">Siga a rotina fixa do dia.</p>'));
    if (r) sc.appendChild(el("div", "routine doc", "<strong>Rotina fixa de " + DOW[dow].toLowerCase() + ":</strong> " + r.html));
    sheet.appendChild(sc);

    // Prompts citados nos Stories
    if (s && s.refs.length) {
      sheet.appendChild(el("div", "section-label", "Prompts dos Stories de hoje"));
      s.refs.forEach(function (ref, i) {
        var a = DATA.arts[ref]; if (!a) return;
        var det = el("details", "art");
        if (i === 0) det.open = true;
        det.appendChild(el("summary", null, "<b>" + ref + "</b> " + a.title));
        det.appendChild(el("div", "doc", a.html));
        sheet.appendChild(det);
      });
    }

    enhance(sheet);
    try { history.replaceState(null, "", "#d" + pad(d)); } catch (e) {}
    if (scroll && (window.matchMedia && window.matchMedia("(max-width: 979px)").matches)) sheet.scrollIntoView();
  }

  function openKit() {
    selected = null; kitBtn.setAttribute("aria-pressed", "true");
    grid.querySelectorAll(".day").forEach(function (b) { b.setAttribute("aria-selected", "false"); });
    sheet.innerHTML = "";
    var head = el("div", "sheet-head"); head.appendChild(el("h2", null, "Kit fixo")); sheet.appendChild(head);
    sheet.appendChild(el("p", null, "Configure isto uma vez. Os prompts de cada dia contam com estas regras."));
    DATA.kit.forEach(function (k, i) {
      var det = el("details", "art"); if (i === 0) det.open = true;
      det.appendChild(el("summary", null, k.title));
      det.appendChild(el("div", "doc", k.html));
      sheet.appendChild(det);
    });
    enhance(sheet);
    try { history.replaceState(null, "", "#kit"); } catch (e) {}
    if ((window.matchMedia && window.matchMedia("(max-width: 979px)").matches)) sheet.scrollIntoView();
  }
  kitBtn.addEventListener("click", openKit);

  document.addEventListener("keydown", function (ev) {
    if (!selected || /input|textarea/i.test(ev.target.tagName)) return;
    if (ev.key === "ArrowRight" && selected < daysInMonth) openDay(selected + 1, false);
    if (ev.key === "ArrowLeft" && selected > 1) openDay(selected - 1, false);
  });

  var h = (location.hash || "").replace("#", "");
  var m = h.match(/^d(\d\d)$/);
  if (h === "kit") openKit();
  else openDay(m && +m[1] >= 1 && +m[1] <= daysInMonth ? +m[1] : (todayN || 1), false);
})();
</script>

</body>
