<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="calendario-versao" content="2026-11-03T12:39:49.178Z">
<title>Calendários de clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: mural de clientes — um quadro por cliente, faixa na cor da campanha do mês */
:root {
  --bg: #0a0b0d;
  --surface: #13151a;
  --surface-2: #1b1e25;
  --line: #262a33;
  --fg: #f1f3f6;
  --muted: #9aa1ad;
  --accent: #C8F542;
  --font-display: "Montserrat", "Arial Black", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eaeef4; --line: #d7dde6; --fg: #10141a; --muted: #586170; --accent: #5F8A0C; color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 30px 22px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.eyebrow { font: 800 12px var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { font: 900 clamp(28px, 5vw, 42px)/1.05 var(--font-display); margin: 6px 0 0; text-wrap: balance; }
.count { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.search { font: 600 15px var(--font-body); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 0; width: 280px; max-width: 100%; }
.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding-block: 0 60px; }
.client { position: relative; display: flex; flex-direction: column; gap: 6px; min-height: 190px; padding: 22px 20px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--fg); text-decoration: none; overflow: hidden; }
.client::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--c, var(--accent)); }
.client:hover { border-color: var(--c, var(--accent)); transform: translateY(-2px); }
.client:focus-visible { outline: 2px solid var(--c, var(--accent)); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) { .client { transition: transform .15s ease, border-color .15s ease; } }
.client .name { font: 900 21px/1.15 var(--font-display); text-wrap: balance; }
.client .ig { color: var(--muted); font-size: 14px; }
.client .month { align-self: flex-start; margin-top: 6px; font: 800 12px var(--font-display); letter-spacing: .08em; text-transform: uppercase; background: var(--c, var(--accent)); color: #0b0b0b; padding: 4px 10px; border-radius: 6px; }
.client .sub { font-size: 14.5px; }
.client .stats { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px 14px; font: 700 13px var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 10px; }
.client .open { font: 800 13px var(--font-display); color: var(--c, var(--accent)); }
.empty { color: var(--muted); padding: 40px 0; }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">@lucasherculiani · i9</div>
      <h1>Calendários de clientes</h1>
      <p class="count" id="count"></p>
    </div>
    <input class="search" id="search" type="search" placeholder="Buscar cliente" aria-label="Buscar cliente" hidden>
  </header>
  <main class="grid" id="grid"></main>
</div>
<footer><div class="wrap">Página interna, não indexada.</div></footer>
<script>
(function () {
  var CLIENTES = [{"slug":"lucas-herculiani","cliente":"Lucas Herculiani","instagram":"@lucasherculiani","subtitulo":"Novembro Azul","ano":2026,"mes":11,"mesNome":"novembro","cor":"#1E8BFF","corClaro":"#0A62C4","mascote":"LUQUINHA","posts":22,"stories":127,"repositorio":"lucasherculiani/i9fit","atualizado":"2026-11-03T11:18:30.362Z"},{"slug":"rej-mercado","cliente":"R&J Mercado","instagram":"@rejmercadomarilia","subtitulo":"Novembro em azul · 23 a 28 em preto","ano":2026,"mes":11,"mesNome":"novembro","cor":"#5EB8FF","corClaro":"#1E5BD8","mascote":"","posts":28,"stories":164,"repositorio":"lucasherculiani/i9fit","atualizado":"2026-11-03T12:36:30.674Z"},{"slug":"jucimara-firmino","cliente":"Jucimara Firmino","instagram":"@jucimara_firmino","subtitulo":"5/nov a 3/dez","ano":2026,"mes":11,"mesNome":"novembro","cor":"#FF3EA5","corClaro":"#C4126F","mascote":"","posts":9,"stories":15,"repositorio":"lucasherculiani/i9fit","atualizado":"2026-11-05T12:00:00.000Z"}];
  var grid = document.getElementById("grid"), search = document.getElementById("search"), count = document.getElementById("count");
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function cap(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function fmt(iso) { var d = new Date(iso); return isNaN(d) ? "" : ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2); }
  function render(q) {
    q = (q || "").toLowerCase();
    var list = CLIENTES.filter(function (c) { return !q || (c.cliente + " " + c.instagram + " " + c.subtitulo).toLowerCase().indexOf(q) > -1; });
    grid.innerHTML = "";
    if (!list.length) { grid.innerHTML = '<p class="empty">' + (CLIENTES.length ? "Nenhum cliente com esse nome." : "Nenhum calendário publicado ainda.") + "</p>"; return; }
    list.forEach(function (c) {
      var a = document.createElement("a");
      a.className = "client"; a.href = "./" + encodeURIComponent(c.slug) + "/";
      a.style.setProperty("--c", c.cor);
      a.innerHTML =
        '<span class="name">' + esc(c.cliente) + "</span>" +
        '<span class="ig">' + esc(c.instagram) + "</span>" +
        '<span class="month">' + esc(cap(c.mesNome)) + " " + c.ano + "</span>" +
        (c.subtitulo ? '<span class="sub">' + esc(c.subtitulo) + "</span>" : "") +
        '<span class="stats"><span>' + c.posts + " posts</span><span>" + c.stories + " stories</span>" +
        (fmt(c.atualizado) ? "<span>atualizado " + fmt(c.atualizado) + "</span>" : "") + "</span>" +
        '<span class="open">Abrir calendário →</span>';
      a.setAttribute("aria-label", c.cliente + ", calendário de " + c.mesNome + " de " + c.ano);
      grid.appendChild(a);
    });
  }
  count.textContent = CLIENTES.length === 1 ? "1 cliente" : CLIENTES.length + " clientes";
  if (CLIENTES.length > 6) { search.hidden = false; search.addEventListener("input", function () { render(search.value); }); }
  render("");
})();
</script>
</body>
</html>
