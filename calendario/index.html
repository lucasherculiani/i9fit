<style>
/* Layout: mesa de produção — calendário do mês fixo à esquerda, ficha do dia à direita (empilha no celular) */
:root {
  --bg: #0a0b0d;
  --surface: #13151a;
  --surface-2: #1b1e25;
  --line: #262a33;
  --fg: #f1f3f6;
  --muted: #9aa1ad;
  --accent: #1e8bff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(30, 139, 255, .14);
  --lime: #c8f542;
  --warn: #ffb020;
  --font-display: "Montserrat", "Arial Black", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eaeef4; --line: #d7dde6;
    --fg: #10141a; --muted: #586170; --accent: #0a62c4; --accent-ink: #ffffff;
    --accent-soft: rgba(10, 98, 196, .10); --lime: #5f8a0c; --warn: #a86400; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eaeef4; --line: #d7dde6;
  --fg: #10141a; --muted: #586170; --accent: #0a62c4; --accent-ink: #ffffff;
  --accent-soft: rgba(10, 98, 196, .10); --lime: #5f8a0c; --warn: #a86400; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 26px 18px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.eyebrow { font: 800 12px var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { font: 900 clamp(28px, 5vw, 42px)/1.05 var(--font-display); margin: 6px 0 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.btn { font: 800 13px var(--font-display); border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 9px 14px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; padding-block: 0 60px; }
@media (min-width: 980px) {
  .layout { grid-template-columns: 430px minmax(0, 1fr); align-items: start; }
  .cal-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
}

/* Calendário */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.cal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.cal-head strong { font: 800 18px var(--font-display); }
.cal-head small { color: var(--muted); font-size: 12.5px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.dow { font: 700 11px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; padding-block: 2px 4px; }
.day { position: relative; min-height: 70px; text-align: left; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 8px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; font: inherit; min-width: 0; }
.day:hover { border-color: var(--accent); }
.day .n { font: 800 15px var(--font-display); font-variant-numeric: tabular-nums; line-height: 1; }
.day .tags { display: flex; flex-wrap: wrap; gap: 3px; }
.tag { font: 700 9.5px var(--font-display); letter-spacing: .03em; text-transform: uppercase; padding: 2px 4px; border-radius: 4px; background: var(--bg); color: var(--muted); line-height: 1.2; }
.tag.feed { background: var(--accent); color: var(--accent-ink); }
.tag.lq { background: var(--lime); color: #0b0b0b; }
.day.past { opacity: .5; }
.day.today { box-shadow: inset 0 0 0 2px var(--lime); }
.day[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); }
.day .star { position: absolute; top: 5px; right: 6px; color: var(--warn); font-size: 11px; }
.empty { min-height: 70px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
@media (max-width: 480px) {
  .day { min-height: 58px; padding: 5px 4px; }
  .tag { font-size: 8.5px; padding: 1px 3px; }
  .tag.sub { display: none; }
}

/* Ficha do dia */
.sheet { min-width: 0; }
.sheet-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 2px solid var(--accent); }
.sheet-head h2 { font: 900 clamp(22px, 3.4vw, 30px)/1.15 var(--font-display); margin: 0; text-wrap: balance; }
.nav { display: flex; gap: 6px; }
.section-label { font: 800 12px var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 26px 0 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; min-width: 0; }
.card h3 { font: 800 19px/1.3 var(--font-display); margin: 0 0 2px; text-wrap: balance; }
.card .meta { font: 700 12px var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.none { color: var(--muted); font-style: italic; }
.routine { font-size: 14.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; margin-top: 10px; }
.doc p, .doc li { max-width: 72ch; }
.doc h3 { font: 700 16.5px var(--font-display); margin: 18px 0 6px; }
.doc a { color: var(--accent); }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.doc blockquote { margin: 12px 0; padding: 10px 14px; border-left: 3px solid var(--warn); background: var(--surface-2); border-radius: 0 6px 6px 0; }
.doc blockquote p { margin: 0; }
.doc code { font-family: var(--font-mono); font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.tbl { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; }
.doc th, .doc td { text-align: left; vertical-align: top; padding: 7px 9px; border-bottom: 1px solid var(--line); min-width: 100px; }
.doc th { font: 700 11.5px var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.doc tr:last-child td { border-bottom: 0; }
.block { margin: 10px 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.block .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); }
.block .kind { font: 700 10.5px var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.block pre { margin: 0; padding: 12px 14px 14px; white-space: pre-wrap; word-break: break-word; font: 13px/1.6 var(--font-mono); overflow-x: auto; }
.block pre code { background: none; padding: 0; font-size: inherit; }
.copy { font: 800 12px var(--font-display); background: var(--accent); color: var(--accent-ink); border: 0; padding: 7px 13px; border-radius: 6px; cursor: pointer; flex: 0 0 auto; }
.copy.done { background: var(--lime); color: #0b0b0b; }
details.art { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 10px; }
details.art summary { cursor: pointer; padding: 12px 16px; font: 800 15px var(--font-display); list-style: none; display: flex; gap: 10px; align-items: center; }
details.art summary::-webkit-details-marker { display: none; }
details.art summary::before { content: "+"; color: var(--accent); font-size: 18px; width: 14px; }
details.art[open] summary::before { content: "−"; }
details.art summary b { color: var(--accent); }
details.art .doc { padding: 0 16px 10px; }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>

<script>
(function () {
  var DATA = {"feed":{"2":[{"head":"(seg, feriado) 19h | REELS | Nutrição avançada","title":"Sua carga não sobe há meses? O problema não é a carga","kind":"reels","luquinha":false,"html":"\u003cp>\u003cstrong>Gravação:\u003c/strong> academia, câmera no tripé na altura do peito. Você termina uma série, devolve a barra e olha para a câmera com cara de &quot;fácil demais&quot;. Depois fala direto para a câmera, com cortes a cada 3 ou 4 s (troca de ângulo ou zoom).\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> foto \u003ccode>1 (13).jpeg\u003c/code> | Título: \u003ccode>SUA CARGA PAROU DE SUBIR?\u003c/code> | Destaque: \u003ccode>PAROU\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> gancho visual (barra voltando ao suporte) + promessa em 2 s | contagem regressiva 3 → 1 com o mais importante no fim | teste prático no final que faz a pessoa assistir de novo antes do treino.\u003c/p>\n\u003cp>\u003cstrong>Roteiro (32 s)\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tempo\u003c/th>\n\u003cth>Fala\u003c/th>\n\u003cth>Texto na tela / imagem\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0–2 s\u003c/td>\n\u003ctd>&quot;Se a sua carga não sobe há três meses, o problema provavelmente não é a carga.&quot;\u003c/td>\n\u003ctd>SUA CARGA PAROU DE SUBIR?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2–5 s\u003c/td>\n\u003ctd>&quot;São três sinais. O primeiro quase todo mundo tem. O terceiro quase ninguém sabe responder.&quot;\u003c/td>\n\u003ctd>3 SINAIS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5–11 s\u003c/td>\n\u003ctd>&quot;Três: você faz exatamente as repetições da ficha. Doze é doze, mesmo quando dava dezesseis.&quot;\u003c/td>\n\u003ctd>3. A FICHA MANDA, NÃO O ESFORÇO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11–17 s\u003c/td>\n\u003ctd>&quot;Dois: a última repetição sai na mesma velocidade da primeira. Perto da falha, a barra desacelera sozinha.&quot;\u003c/td>\n\u003ctd>2. A BARRA NÃO DESACELERA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>17–26 s\u003c/td>\n\u003ctd>&quot;Um: você não sabe dizer quantas repetições sobraram. Isso tem nome: repetições em reserva, o RIR. Uma meta-análise de 2023 mostrou que quanto mais perto da falha a série termina, maior o ganho de músculo.&quot;\u003c/td>\n\u003ctd>1. VOCÊ NÃO SABE SEU RIR\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>26–32 s\u003c/td>\n\u003ctd>&quot;Teste hoje: na última série, anota quantas sobraram. Se foi mais de quatro, agora você sabe por que a carga parou.&quot;\u003c/td>\n\u003ctd>TESTE: QUANTAS SOBRARAM?\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Áudio:\u003c/strong> batida grave e constante, sobe no item 1.\u003c/p>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Hipertrofia e repetições em reserva (RIR): se a sua carga não sobe há meses, provavelmente você está parando a série longe demais da falha.\n\n3 sinais:\n3. Você faz as repetições da ficha, mesmo quando dava para fazer mais.\n2. A última repetição sai tão rápida quanto a primeira.\n1. Você não sabe dizer quantas repetições sobraram.\n\nUma meta-análise publicada em 2023 na Sports Medicine (Refalo e colaboradores) mostrou que o ganho de massa muscular aumenta conforme a série termina mais perto da falha. Não é treinar até morrer em todo exercício. É saber, com honestidade, quanto ainda tinha no tanque.\n\nSalva, testa no próximo treino e volta aqui pra me contar: quantas sobraram na sua última série? 👇\n\n#hipertrofia #musculacao #marilia\n\u003c/code>\u003c/pre>\n"}],"3":[{"head":"(ter) 19h | REELS | Autoridade","title":"Testosterona depois dos 35: o que derruba de verdade","kind":"reels","luquinha":false,"html":"\u003cp>\u003cstrong>Gravação:\u003c/strong> falando para a câmera, plano médio, luz lateral, academia escura. Cortes a cada 3 ou 4 s alternando close e plano médio. Números grandes na tela.\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> foto \u003ccode>1 (14).jpeg\u003c/code> | Título: \u003ccode>TESTOSTERONA DEPOIS DOS 35\u003c/code> | Destaque: \u003ccode>TESTOSTERONA\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> dado chocante nos 2 primeiros segundos | quebra de expectativa (&quot;aposto que você achava que era o treino&quot;) | contagem 3 → 1 | o mito mais popular derrubado no meio, para segurar até o fim.\u003c/p>\n\u003cp>\u003cstrong>Roteiro (35 s)\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tempo\u003c/th>\n\u003cth>Fala\u003c/th>\n\u003cth>Texto na tela\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0–3 s\u003c/td>\n\u003ctd>&quot;Uma semana dormindo cinco horas derrubou a testosterona de homens jovens entre dez e quinze por cento.&quot;\u003c/td>\n\u003ctd>5H DE SONO = -15%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3–6 s\u003c/td>\n\u003ctd>&quot;E aposto que você achava que o problema era o treino. Três coisas que a ciência diz.&quot;\u003c/td>\n\u003ctd>NÃO É O TREINO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6–13 s\u003c/td>\n\u003ctd>&quot;Três: depois dos trinta, a testosterona cai em média cerca de um por cento ao ano. É uma rampa, não um penhasco.&quot;\u003c/td>\n\u003ctd>3. -1% AO ANO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13–22 s\u003c/td>\n\u003ctd>&quot;Dois: o pico de testosterona depois do treino pesado some em menos de uma hora. Não é por causa dele que você ganha músculo.&quot;\u003c/td>\n\u003ctd>2. O PICO PÓS-TREINO É MITO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>22–30 s\u003c/td>\n\u003ctd>&quot;Um: o que mais pesa é sono curto, gordura abdominal e sedentarismo. Esses três você controla.&quot;\u003c/td>\n\u003ctd>1. SONO • CINTURA • MOVIMENTO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>30–35 s\u003c/td>\n\u003ctd>&quot;Acha que a sua tá baixa? Exame e médico. Nunca suplemento de academia nem reposição por conta própria. Novembro Azul é isso.&quot;\u003c/td>\n\u003ctd>EXAME, NÃO ACHISMO 💙\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Testosterona depois dos 35: o que a ciência diz sobre o que realmente derruba (e o que é mito de academia).\n\n😴 Num estudo publicado no JAMA (Leproult e Van Cauter, 2011), uma semana dormindo 5 horas por noite reduziu a testosterona de homens jovens entre 10% e 15%.\n📉 Depois dos 30, a queda média é de cerca de 1% ao ano. É gradual.\n🏋️ O pico de testosterona logo depois do treino pesado é passageiro e não explica o ganho de músculo.\n🎯 O que mais pesa: sono curto, gordura abdominal e sedentarismo.\n\nSe você acha que a sua está baixa, o caminho é exame e consulta com médico. Nunca reposição ou &quot;booster&quot; por conta própria.\n\nQual dos três você precisa resolver primeiro: sono, cintura ou movimento? 👇\n\n#novembroazul #saudedohomem #testosterona\n\u003c/code>\u003c/pre>\n"}],"4":[{"head":"(qua) 19h | CARROSSEL 7 slides | Nutrição avançada | Layout A","title":"5 números que dizem mais sobre sua saúde do que a balança","kind":"carrossel","luquinha":false,"html":"\u003cp>\u003cstrong>Promessa do carrossel:\u003c/strong> 5 medidas que os grandes estudos ligam à longevidade, que qualquer homem pode medir. É o carrossel que a pessoa salva, mede e manda para o amigo.\u003c/p>\n\u003cp>\u003cstrong>Fotos:\u003c/strong> capa \u003ccode>1 (58).jpeg\u003c/code> | slide 7 \u003ccode>1 (13).jpeg\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>Prompt slide 1 (capa)\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nCarrossel de 7 slides para o feed, todos quadrados 1:1, 1080x1080, Layout A (escuro), paleta NOVEMBRO AZUL, seguindo o Kit i9 do projeto. Este é o SLIDE 1 (capa). Mantenha o mesmo estilo em todos os próximos slides.\n\nUse a foto anexada (1 (58).jpeg): a pessoa de braços cruzados em preto e branco, exatamente como está (IDENTITYLOCK). Transforme em duotone preto e azul #1E8BFF, mantendo o rosto nítido e fiel. Pessoa posicionada à direita, do peito para cima.\nNo chão, à esquerda, uma balança de banheiro digital com o visor apagado e um X azul neon sobre ela. Ao redor, flutuando em linhas finas azuis, 5 ícones pequenos: fita métrica, medidor de pressão, mão apertando, coração, pessoa sentada no chão.\n\nTexto à esquerda (Montserrat Black, caixa alta, branco):\n&quot;5 NÚMEROS QUE DIZEM MAIS SOBRE SUA SAÚDE DO QUE A BALANÇA&quot;\nA palavra &quot;BALANÇA&quot; em azul #1E8BFF.\n\nLogo i9 refletido em azul no chão brilhante, como reflexo de luz, no rodapé central. Pequena seta azul e &quot;arrasta&quot; em cinza. @lucasherculiani.\nManter 140 px livres nas laterais.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Prompts dos slides 2 a 6\u003c/strong> (um por vez, no mesmo chat)\u003c/p>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 2 de 7, mesmo estilo. Fundo grafite, número &quot;01&quot; gigante em azul com 20% de opacidade. Ícone de linha azul de uma fita métrica.\nTítulo (Montserrat Black, branco): &quot;CINTURA&quot;\nTexto (Montserrat SemiBold, branco): &quot;Para homens, acima de 94 cm o risco cardiometabólico já é aumentado. Acima de 102 cm, muito aumentado.&quot;\nFonte pequena no rodapé (cinza): &quot;Fonte: OMS&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 3 de 7, mesmo estilo. Número &quot;02&quot; gigante ao fundo. Ícone de linha azul de um medidor de pressão.\nTítulo: &quot;PRESSÃO ARTERIAL&quot;\nTexto: &quot;Abaixo de 12 por 8 é o ideal. A partir de 14 por 9, já é hipertensão. Muita gente tem e não sabe.&quot;\nFonte pequena no rodapé (cinza): &quot;Fonte: Diretriz Brasileira de Hipertensão Arterial, 2020&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 4 de 7, mesmo estilo. Número &quot;03&quot; gigante ao fundo. Ícone de linha azul de uma mão apertando um dinamômetro.\nTítulo: &quot;FORÇA DA MÃO&quot;\nTexto: &quot;No estudo PURE, com quase 140 mil pessoas em 17 países, cada 5 kg a menos de força de preensão se associou a 16% mais risco de morte por qualquer causa.&quot;\nFonte pequena no rodapé (cinza): &quot;Fonte: Leong et al., The Lancet, 2015&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 5 de 7, mesmo estilo. Número &quot;04&quot; gigante ao fundo. Ícone de linha azul de um coração com uma linha de batimento.\nTítulo: &quot;CONDICIONAMENTO&quot;\nTexto: &quot;Num estudo com mais de 120 mil pessoas, baixo condicionamento cardiorrespiratório teve associação com mortalidade igual ou maior que tabagismo e diabetes.&quot;\nFonte pequena no rodapé (cinza): &quot;Fonte: Mandsager et al., JAMA, 2018&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 6 de 7, mesmo estilo. Número &quot;05&quot; gigante ao fundo. Ícone de linha azul de uma pessoa sentada no chão de pernas cruzadas.\nTítulo: &quot;SENTAR E LEVANTAR DO CHÃO&quot;\nTexto: &quot;No teste criado pelo brasileiro Claudio Gil Araújo, pessoas de 51 a 80 anos com as notas mais baixas tiveram de 5 a 6 vezes mais risco de morte do que as com notas mais altas.&quot;\nFonte pequena no rodapé (cinza): &quot;Fonte: Araújo et al., European Journal of Preventive Cardiology, 2012&quot;\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Prompt slide 7 (CTA)\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 7 de 7, mesmo estilo, usando a foto anexada (1 (13).jpeg).\nRecorte a pessoa exatamente como ela é (IDENTITYLOCK), à direita, do peito para cima, fundo grafite com luz de recorte azul.\nÀ esquerda, texto (Montserrat Black, branco): &quot;E O SEXTO NÚMERO?&quot;\nAbaixo (Montserrat SemiBold): &quot;Próstata: quando e como avaliar, você decide com o seu médico. Salva, mede os 5 e marca o parceiro.&quot; com &quot;marca o parceiro&quot; em azul.\nLogo i9 versão azul no rodapé central. @lucasherculiani.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Novembro Azul e saúde do homem: 5 números que dizem mais sobre a sua saúde do que o peso na balança.\n\n1. Circunferência da cintura (OMS: acima de 94 cm o risco já sobe)\n2. Pressão arterial (a partir de 14 por 9 já é hipertensão)\n3. Força de preensão da mão (estudo PURE, The Lancet, 2015)\n4. Condicionamento cardiorrespiratório (JAMA, 2018)\n5. Teste de sentar e levantar do chão (Claudio Gil Araújo, 2012)\n\nOs três últimos têm uma coisa em comum: dá pra melhorar treinando.\n\nE o sexto número é a próstata. Quando e como avaliar é conversa sua com o seu médico, e o Novembro Azul é o lembrete.\n\nSalva, mede os cinco essa semana e marca aqui o parceiro que vai fazer junto 💙\n\n#novembroazul #saudedohomem #longevidade\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Texto alternativo:\u003c/strong> Carrossel do Novembro Azul com Lucas Herculiani em preto e azul ao lado de uma balança riscada, apresentando cinco indicadores de saúde com fonte científica: cintura, pressão arterial, força de preensão, condicionamento e teste de sentar e levantar.\u003c/p>\n"}],"5":[{"head":"(qui) 19h | REELS | Atração","title":"Tipos de corredor no domingo de manhã","kind":"reels","luquinha":false,"html":"\u003cp>\u003cstrong>Gravação:\u003c/strong> você interpretando cada tipo, cortes rápidos de 4 a 5 s, nome do tipo escrito na tela. Grave na rua ou na pista onde você corre.\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> foto \u003ccode>1 (49).jpeg\u003c/code> | Título: \u003ccode>TIPOS DE CORREDOR NO DOMINGO\u003c/code> | Destaque: \u003ccode>CORREDOR\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> um tipo novo a cada 4 s (ninguém sai antes de achar o seu) | o pior tipo fica no meio | o seu tipo no final, que fecha a piada e puxa o comentário.\u003c/p>\n\u003cp>\u003cstrong>Roteiro (30 s)\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tempo\u003c/th>\n\u003cth>Cena\u003c/th>\n\u003cth>Texto na tela\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0–2 s\u003c/td>\n\u003ctd>Você parado olhando para a câmera, de braços abertos\u003c/td>\n\u003ctd>TIPOS DE CORREDOR NO DOMINGO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2–6 s\u003c/td>\n\u003ctd>Sai correndo rápido demais e 3 s depois está caminhando com a mão na cintura\u003c/td>\n\u003ctd>O QUE SAI NO PACE DE ELITE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6–10 s\u003c/td>\n\u003ctd>Ainda suado, mostrando o celular, postando o treino antes de parar o relógio\u003c/td>\n\u003ctd>O QUE POSTA ANTES DE TERMINAR\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10–14 s\u003c/td>\n\u003ctd>Colocando mochila de hidratação gigante, câmera mostra placa &quot;5 km&quot;\u003c/td>\n\u003ctd>O QUE LEVA MOCHILA PRA 5 KM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>14–18 s\u003c/td>\n\u003ctd>Parando para conversar com alguém a cada esquina\u003c/td>\n\u003ctd>O QUE CORRE PRA SOCIALIZAR\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18–22 s\u003c/td>\n\u003ctd>De fone, alguém fala com você, você finge que não ouve, câmera mostra que o fone está sem música\u003c/td>\n\u003ctd>O DO FONE SEM MÚSICA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>22–27 s\u003c/td>\n\u003ctd>Você chegando por último, sorrindo, braço pra cima\u003c/td>\n\u003ctd>E EU: CHEGO POR ÚLTIMO, MAS CHEGO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>27–30 s\u003c/td>\n\u003ctd>Olhando pra câmera\u003c/td>\n\u003ctd>QUAL É VOCÊ? COMENTA 👇\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Áudio:\u003c/strong> áudio em alta de comédia ou trilha animada.\u003c/p>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Corrida de rua em Marília tem todo tipo de corredor. Qual é você? 😂\n\n1. O que sai no pace de elite e termina caminhando\n2. O que posta o treino antes de parar o relógio\n3. O que leva mochila de hidratação pra 5 km\n4. O que corre pra socializar\n5. O do fone sem música\n\nEu? Sou o que chega por último, mas chega.\n\nComenta o número do seu. E se você quer saber como eu encaixo corrida e força na mesma semana, manda CORRIDA no direct.\n\n#corrida #corridaderua #marilia\n\u003c/code>\u003c/pre>\n"}],"6":[{"head":"(sex) 19h | POST ÚNICO | Nutrição avançada | Layout B","title":"80% devagar, 20% forte","kind":"post","luquinha":false,"html":"\u003cp>\u003cstrong>Fotos:\u003c/strong> \u003ccode>1 (4).jpg\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>Prompt ChatGPT\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nPost de feed quadrado 1:1, 1080x1080, Layout B (colorido), paleta NOVEMBRO AZUL, seguindo o Kit i9 do projeto.\n\nUse a foto anexada (1 (4).jpg): a pessoa correndo de camiseta roxa em uma prova, exatamente como está (IDENTITYLOCK: mesmo rosto, cabelo, corpo, roupa e número de peito). Recorte e posicione à direita, corpo inteiro, como se estivesse correndo para fora da arte.\nFundo: azul #1E8BFF chapado com linhas de velocidade brancas finas na horizontal.\nÀ esquerda, uma barra vertical grossa dividida em dois blocos: o de baixo, maior (80% da altura), em branco com o texto &quot;80%&quot;; o de cima, menor (20%), em preto com o texto &quot;20%&quot;. O logo i9 pequeno aparece como marca d&#39;água na base da barra.\n\nTexto na parte superior (Montserrat Black, caixa alta, branco):\n&quot;80% DEVAGAR. 20% FORTE.&quot;\nA palavra &quot;DEVAGAR&quot; em preto.\nTexto de apoio (Montserrat SemiBold, branco, abaixo):\n&quot;É assim que treinam os melhores atletas de endurance do mundo.&quot;\n\n@lucasherculiani pequeno no rodapé. Manter 140 px livres nas laterais.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Treino de corrida polarizado: os corredores mais rápidos do mundo passam a maior parte do tempo correndo devagar.\n\nO fisiologista Stephen Seiler analisou como treinam atletas de elite de endurance (corrida, remo, ciclismo, esqui) e encontrou o mesmo padrão: cerca de 80% dos treinos em intensidade baixa e 20% em intensidade alta. Quase nada no &quot;meio-termo&quot;, que é onde a maioria dos amadores passa todos os treinos.\n\nComo saber se o seu treino leve é leve mesmo: você precisa conseguir falar frases completas enquanto corre. Se não consegue, já virou treino moderado.\n\nRitmo leve não é treino perdido. É o que deixa você aguentar os 20% fortes de verdade.\n\nSalva pro próximo treino. Você corre mais devagar ou no meio-termo? 👇\n\n#corrida #corridaderua #treinodecorrida\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Texto alternativo:\u003c/strong> Lucas Herculiani correndo em uma prova de camiseta roxa ao lado de um gráfico de barra dividido em 80% e 20%, com o texto 80% devagar, 20% forte.\u003c/p>\n"}],"7":[{"head":"(sáb) 11h | REELS LUQUINHA | Atração","title":"O check-up do LUQUINHA (versão CapCut)","kind":"reels","luquinha":true,"html":"\u003cp>\u003cstrong>Duração:\u003c/strong> 20 s = 2 clipes de 10 s, gerados no CapCut (Mídia de IA → Imagem para vídeo).\u003c/p>\n\u003cp>\u003cstrong>Por que mudou:\u003c/strong> no CapCut, a imagem que você sobe vira o primeiro quadro do vídeo. O print do LUQUINHA está na academia, então ele não &quot;vai&quot; para a clínica sozinho. Por isso cada clipe tem 2 passos: (1) o ChatGPT cria a cena parada, (2) o CapCut anima. A voz você coloca no CapCut, porque a IA de vídeo dele não fala português de forma confiável.\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> quadro do clipe 1 | Título: \u003ccode>ATÉ O LUQUINHA FOI AO MÉDICO\u003c/code> | Destaque: \u003ccode>MÉDICO\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> texto-gancho nos 2 primeiros segundos | perna balançando de nervoso cria identificação | a porta abrindo no clipe 2 cria expectativa | frase final curta, feita para ser enviada a alguém.\u003c/p>\n\u003ch3>Clipe 1 | Passo 1: cena parada (ChatGPT, projeto &quot;Artes i9&quot;, anexe \u003ccode>luquinha.png\u003c/code>)\u003c/h3>\n\u003cpre>\u003ccode>IDENTITYLOCK\nUse a imagem anexada (luquinha.png) como referência exata do mascote LUQUINHA: cabeça grande, cabelo cacheado castanho-escuro, barba curta, olhos claros, rosto redondo, físico forte, camiseta preta com o logo i9 no peito, short preto, tênis preto e rosa, smartwatch e pulseira rosa com checks brancos. Mantenha rosto, cabelo, proporções e roupa idênticos. Acrescente só um pequeno laço azul do Novembro Azul preso na camiseta, do lado esquerdo do peito.\n\nImagem vertical 9:16, 1080x1920, render 3D estilo filme de animação de estúdio.\nCena: sala de espera de uma clínica moderna e clara, paredes brancas com detalhes em azul #1E8BFF, cadeiras enfileiradas, uma planta no canto, porta de consultório fechada ao fundo.\nLUQUINHA sentado numa das cadeiras, de frente para a câmera, corpo inteiro visível, uma perna levemente levantada como se estivesse balançando, olhando para o smartwatch com cara de nervoso.\nEnquadramento: ele ocupa o centro, entre 500 px e 1550 px de altura. Topo e base da imagem só com cenário.\nIluminação suave e cinematográfica. Sem nenhum texto, letra, placa escrita ou marca d&#39;água.\n\u003c/code>\u003c/pre>\n\u003ch3>Clipe 1 | Passo 2: animação (CapCut, Imagem para vídeo, anexe a imagem do Passo 1)\u003c/h3>\n\u003cp>Configuração: proporção \u003cstrong>9:16\u003c/strong>, duração \u003cstrong>10 s\u003c/strong>, movimento de câmera \u003cstrong>lento\u003c/strong> (ou &quot;aproximar&quot;).\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK. Anime o personagem exatamente como está na imagem, sem mudar rosto, cabelo, proporções, roupa nem cenário. Animação 3D de estúdio, tom leve e cômico.\n0 a 4 s: ele balança a perna rápido de nervoso e olha o relógio de pulso duas vezes.\n4 a 7 s: percebe a câmera, se ajeita na cadeira e finge estar tranquilo.\n7 a 10 s: olha para a câmera com um sorriso sem graça e mexe a boca como se estivesse falando.\nCâmera: plano médio fixo com aproximação bem lenta.\nSem texto, sem legenda, sem marca d&#39;água.\n\u003c/code>\u003c/pre>\n\u003ch3>Clipe 2 | Passo 1: cena parada (ChatGPT, no mesmo chat do Clipe 1)\u003c/h3>\n\u003cpre>\u003ccode>IDENTITYLOCK\nPróxima cena, mesmo personagem, mesma sala de espera, mesma iluminação e mesmo estilo da imagem anterior.\nImagem vertical 9:16, 1080x1920.\nLUQUINHA agora está de pé, no centro, de frente para a câmera, corpo inteiro, entre 500 px e 1550 px de altura. Atrás dele, a porta do consultório está entreaberta e de dentro sai uma luz azulada suave. Expressão: respirando fundo, decidido.\nMantenha o pequeno laço azul na camiseta. Sem nenhum texto, letra, placa escrita ou marca d&#39;água.\n\u003c/code>\u003c/pre>\n\u003ch3>Clipe 2 | Passo 2: animação (CapCut, Imagem para vídeo, anexe a imagem acima)\u003c/h3>\n\u003cp>Configuração: proporção \u003cstrong>9:16\u003c/strong>, duração \u003cstrong>10 s\u003c/strong>, movimento de câmera \u003cstrong>fixo\u003c/strong>.\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK. Anime o personagem exatamente como está na imagem, sem mudar rosto, cabelo, proporções, roupa nem cenário. Animação 3D de estúdio, tom confiante e leve.\n0 a 3 s: ele respira fundo e estufa o peito.\n3 a 7 s: olha para a câmera, faz joinha com a mão e mexe a boca como se estivesse falando, sorrindo.\n7 a 10 s: vira de costas e caminha confiante em direção à porta iluminada do consultório, entrando.\nCâmera: plano médio fixo.\nSem texto, sem legenda, sem marca d&#39;água.\n\u003c/code>\u003c/pre>\n\u003ch3>Montagem no CapCut (passo a passo)\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Novo projeto\u003c/strong> → importe o Clipe 1 e o Clipe 2, nessa ordem → \u003cstrong>Proporção 9:16\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Corte entre os clipes:\u003c/strong> corte seco (sem transição) ou &quot;Desfoque&quot; com 0,2 s. Transição longa derruba a retenção.\u003c/li>\n\u003cli>\u003cstrong>Voz\u003c/strong> (escolha uma):\u003cul>\n\u003cli>\u003cstrong>Sua voz (recomendado, o LUQUINHA é a sua versão boneco):\u003c/strong> Áudio → \u003cstrong>Narração\u003c/strong>. Grave no tom de brincadeira.\u003c/li>\n\u003cli>\u003cstrong>Voz de IA:\u003c/strong> Texto → digite a fala → \u003cstrong>Texto para fala\u003c/strong> → voz masculina em português.\u003c/li>\n\u003cli>Fala 1, começando em \u003cstrong>0:07\u003c/strong>: &quot;Novembro Azul, parceiro. Até eu vim fazer meu check-up.&quot;\u003c/li>\n\u003cli>Fala 2, começando em \u003cstrong>0:13\u003c/strong>: &quot;Consulta não é só quando dói. Marca a sua. Bora!&quot;\u003c/li>\n\u003cli>Se o seu CapCut tiver \u003cstrong>Sincronização labial\u003c/strong>, aplique em cada clipe com o áudio da fala.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Sons\u003c/strong> (Áudio → Efeitos sonoros): &quot;tique-taque de relógio&quot; de 0:00 a 0:07; &quot;porta abrindo&quot; em 0:10; música animada da biblioteca entrando em 0:16, volume 20%.\u003c/li>\n\u003cli>\u003cstrong>Textos na tela\u003c/strong> (fonte \u003cstrong>Montserrat\u003c/strong>, peso Black; se não tiver, \u003cstrong>Poppins\u003c/strong> Bold). Branco, com contorno preto fino. Posicione no meio da tela, nunca no topo nem embaixo (área dos botões do Instagram):\u003cul>\n\u003cli>0:00 a 0:02 (gancho): \u003ccode>ATÉ O LUQUINHA FOI AO MÉDICO 👀\u003c/code>\u003c/li>\n\u003cli>0:02 a 0:10: \u003ccode>NOVEMBRO AZUL 💙\u003c/code>\u003c/li>\n\u003cli>0:13 a 0:20: \u003ccode>CONSULTA NÃO É SÓ QUANDO DÓI\u003c/code> com a palavra \u003ccode>DÓI\u003c/code> em azul #1E8BFF.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Legendas automáticas:\u003c/strong> Texto → \u003cstrong>Legendas automáticas\u003c/strong> → Português. Estilo branco com destaque azul, posição logo acima do terço inferior. Revise acentos.\u003c/li>\n\u003cli>\u003cstrong>Logo i9:\u003c/strong> Sobreposição → \u003ccode>i9_avatar_novembro_azul.png\u003c/code>, pequeno, canto inferior direito, acima da área dos botões, nos últimos 3 s.\u003c/li>\n\u003cli>\u003cstrong>Capa:\u003c/strong> toque em \u003cstrong>Capa\u003c/strong> → escolha um quadro do clipe 1 → adicione o texto \u003ccode>ATÉ O LUQUINHA FOI AO MÉDICO\u003c/code>, com \u003ccode>MÉDICO\u003c/code> em azul, no meio da tela.\u003c/li>\n\u003cli>\u003cstrong>Exportar:\u003c/strong> 1080p, 30 fps.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Novembro Azul: até o LUQUINHA marcou o check-up 💙\n\nHomem tem mania de esperar doer pra ir ao médico. Só que o check-up é justamente pra você descobrir as coisas antes de doer.\n\nEste mês o desafio é simples: marca a consulta de rotina. Quais exames fazer, o médico vê com você.\n\nManda esse vídeo pro homem que está há mais de um ano sem consulta. Ele sabe quem é 👀\n\n#novembroazul #saudedohomem #checkup\n\u003c/code>\u003c/pre>\n"}],"9":[{"head":"(seg) 19h | REELS | Nutrição avançada","title":"Laboratório i9, ep. 1: correr rouba seu músculo?","kind":"reels","luquinha":false,"html":"\u003cp>\u003cstrong>Série da semana:\u003c/strong> &quot;LABORATÓRIO i9&quot;, em que você mostra o que a ciência diz e como aplica no seu próprio treino. Selo fixo no canto durante a série: \u003ccode>LABORATÓRIO i9 | EP. 1\u003c/code> (Montserrat Black, faixa azul).\u003c/p>\n\u003cp>\u003cstrong>Gravação:\u003c/strong> abre com você correndo e corta seco para você embaixo da barra. Depois, fala para a câmera.\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> foto \u003ccode>1 (26).jpeg\u003c/code> | Título: \u003ccode>CORRER ROUBA MÚSCULO?\u003c/code> | Destaque: \u003ccode>MÚSCULO\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> pergunta polêmica + contraste visual (corrida → barra) | resposta &quot;não&quot; no meio, seguida de &quot;mas tem um porém&quot; para segurar até o fim | final com o que você faz na sua semana.\u003c/p>\n\u003cp>\u003cstrong>Roteiro (33 s)\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tempo\u003c/th>\n\u003cth>Fala\u003c/th>\n\u003cth>Texto na tela\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0–2 s\u003c/td>\n\u003ctd>&quot;Eu corro, faço cross e musculação. Correr tá roubando meu músculo?&quot;\u003c/td>\n\u003ctd>CORRER ROUBA MÚSCULO?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2–7 s\u003c/td>\n\u003ctd>&quot;Isso tem nome: efeito interferência. E a resposta tem um porém que mudou como eu monto minha semana.&quot;\u003c/td>\n\u003ctd>EFEITO INTERFERÊNCIA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7–15 s\u003c/td>\n\u003ctd>&quot;Uma meta-análise de 2022 juntou dezenas de estudos: treinar força e aeróbico juntos não atrapalhou o ganho de músculo nem a força máxima.&quot;\u003c/td>\n\u003ctd>MÚSCULO: ✅ FORÇA MÁXIMA: ✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15–23 s\u003c/td>\n\u003ctd>&quot;O porém: atrapalhou a força explosiva, principalmente quando os dois estavam na mesma sessão. E a corrida interfere mais que a bike.&quot;\u003c/td>\n\u003ctd>EXPLOSÃO: ⚠️\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>23–33 s\u003c/td>\n\u003ctd>&quot;Então, na minha semana: quando força é prioridade, ela vem primeiro. E sempre que dá, separo corrida e força por algumas horas. Salva e segue pro episódio dois.&quot;\u003c/td>\n\u003ctd>FORÇA PRIMEIRO • SEPARA AS SESSÕES\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Treino concorrente: correr atrapalha o ganho de massa muscular? A ciência responde (e tem um porém).\n\n✅ Uma meta-análise de 2022 (Schumann e colaboradores, Sports Medicine) mostrou que combinar treino aeróbico e treino de força não comprometeu a hipertrofia nem a força máxima.\n⚠️ Mas a força explosiva foi prejudicada, principalmente quando os dois treinos aconteciam na mesma sessão.\n🏃 Estudos anteriores já mostravam que a corrida gera mais interferência do que a bicicleta.\n\nComo eu aplico: quando força é prioridade, ela vem primeiro. E, sempre que a rotina deixa, separo corrida e musculação por algumas horas.\n\nEsse é o episódio 1 do Laboratório i9. Até sábado tem mais dois.\nVocê corre e faz musculação no mesmo dia? Comenta como organiza 👇\n\n#treinoconcorrente #corrida #musculacao\n\u003c/code>\u003c/pre>\n"}],"10":[{"head":"(ter) 19h | CARROSSEL 7 slides | Nutrição avançada | Layout A","title":"Força para corredor: o que os estudos usaram","kind":"carrossel","luquinha":false,"html":"\u003cp>\u003cstrong>Promessa do carrossel:\u003c/strong> o protocolo de força que os estudos usaram para deixar o corredor mais econômico. Quem corre salva para levar no próximo treino de perna.\u003c/p>\n\u003cp>\u003cstrong>Fotos:\u003c/strong> capa \u003ccode>1 (2).png\u003c/code> | slide 7 \u003ccode>1 (44).jpeg\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>Prompt slide 1 (capa)\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nCarrossel de 7 slides para o feed, todos quadrados 1:1, 1080x1080, Layout A (escuro), paleta NOVEMBRO AZUL, seguindo o Kit i9 do projeto. Este é o SLIDE 1 (capa). Mantenha o mesmo estilo em todos os próximos slides.\n\nUse a foto anexada (1 (2).png): a pessoa correndo de camiseta preta ao entardecer, exatamente como está (IDENTITYLOCK). Posicione à direita, corpo inteiro, ocupando 50% da largura. Escureça o fundo e acrescente luz de recorte azul nas bordas do corpo.\nNo pulso dele, a tela do smartwatch acesa mostrando o logo i9 em azul, com brilho visível (detalhe criativo, sem alterar a mão nem o braço).\nAtrás dele, em linhas finas azuis, o desenho técnico de uma barra olímpica com anilhas, como um projeto de engenharia, sobreposto à rua.\n\nTexto à esquerda (Montserrat Black, caixa alta, branco):\n&quot;FORÇA PRO CORREDOR: O QUE OS ESTUDOS USARAM&quot;\nA palavra &quot;ESTUDOS&quot; em azul #1E8BFF.\nAbaixo (Montserrat SemiBold, cinza): &quot;Salva antes do próximo treino de perna&quot;\n\nPequena seta azul e &quot;arrasta&quot; em cinza. @lucasherculiani.\nManter 140 px livres nas laterais.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Prompts dos slides 2 a 6\u003c/strong> (um por vez, no mesmo chat)\u003c/p>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 2 de 7, mesmo estilo. Fundo grafite, número &quot;01&quot; gigante em azul com 20% de opacidade. Ícone de linha azul de um medidor de combustível.\nTítulo (Montserrat Black, branco): &quot;MAIS ECONÔMICO NO MESMO PACE&quot;\nTexto (Montserrat SemiBold, branco): &quot;Uma meta-análise mostrou que o treino de força melhora a economia de corrida: você gasta menos energia para correr na mesma velocidade.&quot;\nFonte pequena no rodapé (cinza): &quot;Fonte: Blagrove et al., Sports Medicine, 2018&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 3 de 7, mesmo estilo. Número &quot;02&quot; gigante ao fundo. Ícone de linha azul de uma anilha pesada.\nTítulo: &quot;PESADO E POUCO&quot;\nTexto: &quot;Os melhores resultados vieram de cargas altas (acima de 80% da carga máxima) com poucas repetições, muitas vezes combinadas com pliometria, 2 a 3 vezes por semana.&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 4 de 7, mesmo estilo. Número &quot;03&quot; gigante ao fundo. Desenho anatômico em linha azul da panturrilha, com o músculo sóleo destacado.\nTítulo: &quot;O MÚSCULO ESQUECIDO&quot;\nTexto: &quot;O sóleo, a parte profunda da panturrilha, está entre os músculos que mais produzem força a cada passada. Panturrilha com joelho dobrado não é detalhe.&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 5 de 7, mesmo estilo. Número &quot;04&quot; gigante ao fundo. Ícone de linha azul de uma pena sobre uma balança.\nTítulo: &quot;NÃO DEIXA VOCÊ PESADO&quot;\nTexto: &quot;Com carga alta e pouco volume, o estímulo é mais neural do que de crescimento. O ganho de massa tende a ser pequeno.&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 6 de 7, mesmo estilo. Número &quot;05&quot; gigante ao fundo. Ícone de linha azul de um calendário com dois dias destacados.\nTítulo: &quot;DIA DURO DURO, DIA LEVE LEVE&quot;\nTexto: &quot;Na minha semana, a força pesada entra no mesmo dia do treino intenso de corrida. Assim o dia leve continua leve de verdade.&quot;\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Prompt slide 7 (CTA)\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 7 de 7, mesmo estilo, usando a foto anexada (1 (44).jpeg).\nRecorte o rosto e os ombros da pessoa exatamente como estão (IDENTITYLOCK), à direita, com fundo grafite e luz de recorte azul.\nÀ esquerda (Montserrat Black, branco): &quot;VOCÊ CORRE E NUNCA FEZ FORÇA?&quot;\nAbaixo (Montserrat SemiBold): &quot;Manda CORRIDA no direct.&quot; com CORRIDA em azul.\nLinha final menor: &quot;Salva e manda pro seu grupo de corrida.&quot;\nLogo i9 versão azul no rodapé central. @lucasherculiani.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Treino de força para corredores: o que os estudos usaram para deixar o corredor mais rápido sem ficar pesado.\n\n⛽ Força melhora a economia de corrida: você gasta menos energia no mesmo pace (meta-análise de Blagrove e colaboradores, Sports Medicine, 2018).\n🏋️ Os melhores resultados vieram de carga alta, poucas repetições e pliometria, 2 a 3 vezes por semana.\n🦵 O sóleo, a parte profunda da panturrilha, é um dos músculos que mais trabalham a cada passada.\n🪶 Com pouco volume, o ganho de massa tende a ser pequeno.\n📅 Dia duro duro, dia leve leve.\n\nIsso não é uma planilha pra copiar. É o que a pesquisa mostra, para você levar ao seu treinador ou montar com acompanhamento.\n\nSalva, manda pro seu grupo de corrida e me conta: você faz força na semana de corrida? 👇\n\n#corrida #treinodeforca #corridaderua\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Texto alternativo:\u003c/strong> Lucas Herculiani correndo ao entardecer com um desenho técnico de barra olímpica ao fundo e cinco achados científicos sobre treino de força para corredores.\u003c/p>\n"}],"11":[{"head":"(qua) | SÓ STORIES | 11.11 Mercado Livre","title":"(qua) | SÓ STORIES | 11.11 Mercado Livre","kind":"stories","luquinha":false,"html":"\u003cp>Sem post no feed. Dia inteiro de achadinhos nos Stories (ver \u003ccode>02-stories-afiliados-i9.md\u003c/code>).\u003c/p>\n"}],"12":[{"head":"(qui) 19h | REELS | Nutrição avançada","title":"Laboratório i9, ep. 2: placa de carbono vale pra você?","kind":"reels","luquinha":false,"html":"\u003cp>\u003cstrong>Gravação:\u003c/strong> close lento girando um tênis de corrida na mão, luz dura de lado. Depois, você falando para a câmera. Selo \u003ccode>LABORATÓRIO i9 | EP. 2\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> foto \u003ccode>1 (47).jpeg\u003c/code> | Título: \u003ccode>PLACA DE CARBONO VALE PRA VOCÊ?\u003c/code> | Destaque: \u003ccode>CARBONO\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> número forte no gancho (4%) + pergunta pessoal (&quot;e você?&quot;) | dado que vira o jogo no meio | conclusão prática com recomendação de compra, que leva aos Stories.\u003c/p>\n\u003cp>\u003cstrong>Roteiro (32 s)\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tempo\u003c/th>\n\u003cth>Fala\u003c/th>\n\u003cth>Texto na tela\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0–3 s\u003c/td>\n\u003ctd>&quot;Esse tipo de tênis deixou corredores de elite quatro por cento mais econômicos. E você, que corre a seis por quilômetro?&quot;\u003c/td>\n\u003ctd>+4% PRA ELITE. E PRA VOCÊ?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3–12 s\u003c/td>\n\u003ctd>&quot;Em 2018, um estudo mostrou que placa de carbono com espuma de alto retorno melhorou em média quatro por cento a economia de corrida de atletas de elite.&quot;\u003c/td>\n\u003ctd>2018: +4% DE ECONOMIA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>12–21 s\u003c/td>\n\u003ctd>&quot;Só que estudos depois mostraram que o efeito varia muito de pessoa pra pessoa e tende a ser menor em ritmos mais lentos.&quot;\u003c/td>\n\u003ctd>MAIS LENTO = MENOS EFEITO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>21–29 s\u003c/td>\n\u003ctd>&quot;Minha conclusão: pra prova alvo, pode valer. Pro treino do dia a dia, o dinheiro rende mais num bom tênis de treino e em força na academia.&quot;\u003c/td>\n\u003ctd>PROVA: TALVEZ • TREINO: NÃO PRECISA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>29–32 s\u003c/td>\n\u003ctd>&quot;Os que eu recomendo pelo custo-benefício tão nos Stories.&quot;\u003c/td>\n\u003ctd>TÊNIS NOS STORIES 👆\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Tênis com placa de carbono vale a pena para corredor amador? O que a ciência mostra.\n\n🔬 Em 2018, Hoogkamer e colaboradores mostraram que tênis com placa de carbono e espuma de alto retorno melhoraram em média 4% a economia de corrida de atletas de elite.\n📉 Estudos posteriores mostraram que a resposta varia muito entre pessoas e tende a ser menor em ritmos mais lentos.\n\nMinha conclusão para quem corre acima de 6 min/km: para a prova alvo, pode valer. Para treinar todo dia, um bom tênis de treino e força na academia rendem mais.\n\nOs tênis que eu recomendo pelo custo-benefício estão nos Stories de hoje (link de afiliado do Mercado Livre).\n\nVocê correria de placa de carbono? SIM ou NÃO PRECISO? 👇\n\n#corrida #tenisdecorrida #corridaderua\n\u003c/code>\u003c/pre>\n"}],"13":[{"head":"(sex) 19h | REELS | Prova social","title":"Da primeira competição à medalha em dupla","kind":"reels","luquinha":false,"html":"\u003cp>\u003cstrong>Material:\u003c/strong> montagem com as fotos da competição (efeito de zoom lento e cortes no ritmo da música) + sua voz em off.\nOrdem das fotos: \u003ccode>1 (57).jpg\u003c/code> → \u003ccode>1 (64).jpg\u003c/code> → \u003ccode>1 (65).jpg\u003c/code> → \u003ccode>1 (55).jpg\u003c/code> → \u003ccode>1 (86).jpg\u003c/code> → \u003ccode>1 (71).jpg\u003c/code> → \u003ccode>1 (93).jpg\u003c/code> → \u003ccode>1 (94).jpg\u003c/code> → \u003ccode>1 (85).jpg\u003c/code> → \u003ccode>1 (95).jpg\u003c/code> → \u003ccode>1 (96).jpg\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> foto \u003ccode>1 (85).jpg\u003c/code> | Título: \u003ccode>NÃO SOU ATLETA. MAS…\u003c/code> | Destaque: \u003ccode>ATLETA\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> frase de contradição no gancho (&quot;não sou atleta. mas…&quot;) | uma foto nova a cada 1 s nos primeiros 10 s | medalha só aparece no final (payoff) | trilha que cresce até o último segundo.\u003c/p>\n\u003cp>\u003cstrong>Roteiro (30 s)\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tempo\u003c/th>\n\u003cth>Fala (off)\u003c/th>\n\u003cth>Texto na tela / imagem\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0–2 s\u003c/td>\n\u003ctd>&quot;Eu não sou atleta. Olha o que aconteceu.&quot;\u003c/td>\n\u003ctd>NÃO SOU ATLETA. MAS…\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2–10 s\u003c/td>\n\u003ctd>&quot;Treino depois do trabalho. Cansado. Com semana boa e semana ruim.&quot;\u003c/td>\n\u003ctd>DEPOIS DO TRABALHO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10–20 s\u003c/td>\n\u003ctd>&quot;Aí veio a competição em dupla. Barra, caixa, corda e uma parceira que não deixou eu parar.&quot;\u003c/td>\n\u003ctd>COMPETIÇÃO EM DUPLA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20–27 s\u003c/td>\n\u003ctd>&quot;Não cheguei lá porque sou o mais forte. Cheguei porque continuei aparecendo.&quot;\u003c/td>\n\u003ctd>CONTINUEI APARECENDO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>27–30 s\u003c/td>\n\u003ctd>&quot;Acha que competição não é pra você? Comenta EU.&quot;\u003c/td>\n\u003ctd>COMENTA &quot;EU&quot;\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Áudio:\u003c/strong> trilha épica que cresce até o fim (estilo &quot;build up&quot; de filme).\u003c/p>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Competição de cross training para amadores existe, e eu sou a prova de que não precisa ser atleta pra participar.\n\nEu treino depois do trabalho. Tenho semana boa e semana ruim. E mesmo assim fui pra uma competição em dupla e voltei com medalha no peito.\n\nO que me levou até lá não foi força nem talento. Foi aparecer, semana depois de semana. E ter uma dupla que não deixou eu desistir no meio do WOD.\n\nSe você acha que competição não é pra você, comenta EU que eu te conto por onde eu comecei.\n\n#crosstraining #competicao #marilia\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Atenção:\u003c/strong> peça autorização da sua dupla e marque o perfil dela no vídeo.\u003c/p>\n"}],"14":[{"head":"(sáb) 11h | REELS LUQUINHA | Nutrição avançada","title":"Laboratório i9, ep. 3: deload não é preguiça","kind":"reels","luquinha":true,"html":"\u003cp>\u003cstrong>Duração:\u003c/strong> 20 s = 2 prompts.\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> quadro do clipe 1 | Título: \u003ccode>DELOAD NÃO É PREGUIÇA\u003c/code> | Destaque: \u003ccode>DELOAD\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> LUQUINHA travado embaixo da barra cria o problema nos primeiros 3 s | virada visual no clipe 2 (ele tira anilhas e depois a barra sobe fácil) | o dado entra na legenda e na tela, para quem pausar.\u003c/p>\n\u003cp>\u003cstrong>Prompt vídeo 1/2 (0–10 s)\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nUse a imagem anexada (luquinha.png) como referência exata do personagem LUQUINHA: mascote 3D estilo boneco colecionável, cabeça grande, cabelo cacheado castanho-escuro, barba curta, olhos claros, rosto redondo, físico forte, camiseta preta com o logo i9 no peito, short preto, tênis preto e rosa, smartwatch e pulseira rosa com checks brancos. Mantenha rosto, cabelo, proporções e roupa idênticos.\n\nVídeo vertical 9:16, 10 segundos, animação 3D cinematográfica, tom cômico.\nCena: academia à noite, luz dura de cima, detalhes azuis. LUQUINHA embaixo de uma barra de agachamento carregada com muitas anilhas.\n0–3 s: ele tenta subir do agachamento, treme inteiro, a barra não sobe. Suor exagerado e cômico.\n3–6 s: devolve a barra no suporte com dificuldade. O smartwatch no pulso pisca em vermelho (sem números nem letras).\n6–10 s: senta no banco, exausto (expressão de &quot;exausto no km 4&quot;), olha para a câmera e fala.\nFala (português do Brasil, voz masculina adulta, cansada e engraçada): &quot;Oitava semana de treino pesado... e a carga não sobe mais.&quot;\nCâmera: plano médio lateral, termina em close no rosto.\nÁudio: barra batendo no suporte, respiração ofegante cômica.\nSem legendas, sem texto na tela, sem marcas d&#39;água.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Prompt vídeo 2/2 (10–20 s)\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nMesmo personagem da imagem anexada (luquinha.png), idêntico ao vídeo anterior: mascote 3D LUQUINHA, cabeça grande, cabelo cacheado castanho-escuro, barba curta, olhos claros, camiseta preta com logo i9, short preto, tênis preto e rosa, smartwatch, pulseira rosa com checks brancos.\n\nVídeo vertical 9:16, 10 segundos, animação 3D cinematográfica.\nCena: mesma academia, agora com luz mais clara e azulada.\n0–3 s: LUQUINHA tira metade das anilhas da barra, tranquilo, assobiando.\n3–5 s: transição rápida com folhas de calendário voando, indicando que uma semana passou.\n5–8 s: ele recoloca todas as anilhas e agacha com facilidade, subindo firme e sorrindo. O smartwatch acende em azul.\n8–10 s: devolve a barra, olha para a câmera, dá uma piscadinha e fala.\nFala (português do Brasil, voz masculina adulta, confiante): &quot;Deload, parceiro. Não é preguiça. É estratégia.&quot;\nCâmera: plano médio, push-in no final.\nÁudio: assobio, som de folhas de calendário, música animada.\nSem legendas, sem texto na tela, sem marcas d&#39;água.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Textos na tela (CapCut):\u003c/strong> selo \u003ccode>LABORATÓRIO i9 | EP. 3\u003c/code> nos dois clipes | clipe 2: \u003ccode>DELOAD A CADA ~5-6 SEMANAS (MÉDIA ENTRE ATLETAS DE FORÇA)\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Deload no treino de força: a semana em que você treina menos e volta mais forte (episódio 3 do Laboratório i9).\n\nDeload é uma redução planejada de volume ou intensidade para a fadiga baixar e o desempenho voltar a subir. Não é parar de treinar.\n\nNuma pesquisa com atletas e treinadores de força (Bell e colaboradores, 2022), o deload acontecia em média a cada 5 a 6 semanas e durava cerca de uma semana, geralmente com menos volume.\n\nSinais de que pode ser hora: carga travada por semanas, sono pior, articulações reclamando e zero vontade de treinar.\n\nSalva pra lembrar quando a carga travar. Você já fez deload alguma vez? 👇\n\n#deload #treinodeforca #musculacao\n\u003c/code>\u003c/pre>\n"}],"16":[{"head":"(seg) 19h | REELS | Autoridade","title":"Bastidor: tô construindo a i9","kind":"reels","luquinha":false,"html":"\u003cp>\u003cstrong>Gravação:\u003c/strong> misture 3 tipos de cena: (1) você no notebook à noite, (2) gravação de tela da plataforma em desenvolvimento, rolando páginas, (3) você falando para a câmera.\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> foto \u003ccode>1 (36).jpg\u003c/code> | Título: \u003ccode>TÔ CONSTRUINDO A i9\u003c/code> | Destaque: \u003ccode>i9\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> &quot;faz meses que eu tô construindo uma coisa&quot; abre um segredo | a tela da plataforma só aparece aos 3 s | lista rápida com corte a cada item | o final dá exclusividade (lista VIP).\u003c/p>\n\u003cp>\u003cstrong>Roteiro (35 s)\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tempo\u003c/th>\n\u003cth>Fala\u003c/th>\n\u003cth>Imagem / texto na tela\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0–3 s\u003c/td>\n\u003ctd>&quot;Faz meses que eu tô construindo uma coisa, e hoje eu vou te mostrar um pedaço.&quot;\u003c/td>\n\u003ctd>Você no notebook\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3–10 s\u003c/td>\n\u003ctd>&quot;Chama i9. É uma plataforma de treino pra quem tem vida corrida e não quer treinar no achismo.&quot;\u003c/td>\n\u003ctd>Gravação de tela, logo i9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10–20 s\u003c/td>\n\u003ctd>&quot;Vai ter artigos com fonte, treinos gratuitos, e planos de treino com acompanhamento, assinados por profissional de Educação Física registrado.&quot;\u003c/td>\n\u003ctd>Rolando as páginas\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20–28 s\u003c/td>\n\u003ctd>&quot;Eu tô na faculdade de Educação Física, e a i9 é o jeito de levar o que eu aprendo pra mais gente, do jeito certo.&quot;\u003c/td>\n\u003ctd>Você falando pra câmera\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>28–35 s\u003c/td>\n\u003ctd>&quot;Ainda não tá pronta. Mas a lista VIP abre hoje. Manda I9 no direct.&quot;\u003c/td>\n\u003ctd>Logo i9 animado\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Plataforma de treino online i9: faz meses que eu estou construindo isso, e hoje te mostro um pedaço do bastidor.\n\nA ideia é simples: treino pra quem tem vida corrida e não quer treinar no achismo.\n\n📚 Artigos com fonte, em português claro\n🆓 Treinos gratuitos pra começar\n📋 Planos de treino com acompanhamento, assinados por profissional de Educação Física registrado\n\nAinda não está pronta. Mas a lista VIP abre hoje, e quem entrar primeiro recebe a condição de fundador na abertura.\n\nManda I9 no direct que eu coloco seu nome na lista 💙\n\n#treinoonline #musculacao #marilia\n\u003c/code>\u003c/pre>\n"}],"17":[{"head":"(ter) 19h | CARROSSEL 7 slides | Conversão | Layout A","title":"O que vai ter na plataforma i9","kind":"carrossel","luquinha":false,"html":"\u003cp>\u003cstrong>Fotos:\u003c/strong> capa \u003ccode>1 (40).jpg\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>Prompt slide 1 (capa)\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nCarrossel de 7 slides para o feed, todos quadrados 1:1, 1080x1080, Layout A (escuro), paleta NOVEMBRO AZUL, seguindo o Kit i9 do projeto. Este é o SLIDE 1 (capa). Mantenha o mesmo estilo em todos os próximos slides.\n\nUse a foto anexada (1 (40).jpg): a pessoa de mãos na cintura na academia escura com luzes ao fundo, exatamente como está (IDENTITYLOCK). Posicione à esquerda, do quadril para cima, ocupando 45% da largura.\nÀ direita, flutuando inclinado em 3D, um smartphone preto de bordas finas. Na tela, o ícone premium do app i9 (vidro preto, borda neon azul, letras com degradê de profundidade, como no arquivo do projeto i9_icone_app_novembro_azul), com brilho azul saindo da tela e iluminando o rosto da pessoa de leve.\n\nTexto na parte superior (Montserrat Black, caixa alta, branco):\n&quot;O QUE VAI TER NA PLATAFORMA i9&quot;\n&quot;i9&quot; mantém a grafia minúscula do logo e vai em azul #1E8BFF.\n\nPequena seta azul e &quot;arrasta&quot; em cinza. @lucasherculiani.\nManter 140 px livres nas laterais.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Prompts dos slides 2 a 6\u003c/strong> (um por vez, no mesmo chat)\u003c/p>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 2 de 7, mesmo estilo. Fundo grafite. À direita, o mesmo smartphone em 3D, menor, mostrando na tela uma página de artigo genérica (linhas de texto ilegíveis e uma imagem de corrida).\nTítulo (Montserrat Black, branco): &quot;ARTIGOS&quot;\nTexto (Montserrat SemiBold, branco): &quot;Conteúdo com fonte, em português claro. Treino, corrida, sono e força depois dos 40.&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 3 de 7, mesmo estilo. Smartphone mostrando uma tela de treino com ícones de exercício e um botão azul de play.\nTítulo: &quot;TREINOS GRATUITOS&quot;\nTexto: &quot;Pra quem quer começar sem gastar nada.&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 4 de 7, mesmo estilo. Smartphone mostrando uma tela de plano de treino com calendário semanal e um selo azul de verificado.\nTítulo: &quot;PLANOS DE TREINO&quot;\nTexto: &quot;Acompanhamento estilo consultoria, com treino assinado por profissional de Educação Física com CREF.&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 5 de 7, mesmo estilo. Smartphone mostrando uma tela com ícone de prato e folha. Selo pequeno &quot;EM BREVE&quot; em azul no canto da tela.\nTítulo: &quot;NUTRIÇÃO&quot;\nTexto: &quot;Orientação com nutricionista dentro da plataforma.&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 6 de 7, mesmo estilo. Sem smartphone. Três ícones de linha azul em coluna: relógio, pessoa caminhando, alvo.\nTítulo: &quot;PRA QUEM É&quot;\nTexto: &quot;Pra quem tem rotina corrida, está começando ou voltando a treinar e quer parar de treinar no achismo.&quot;\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Próximo slide. IDENTITYLOCK. SLIDE 7 de 7, mesmo estilo. No centro, o ícone premium do app i9 grande, em 3D, com brilho azul intenso e reflexo no chão.\nTítulo (Montserrat Black, branco): &quot;LISTA VIP ABERTA&quot;\nTexto: &quot;Quem entrar primeiro recebe a condição de fundador na abertura.&quot;\nLinha final (Montserrat Black, azul): &quot;MANDA I9 NO DIRECT&quot;\n@lucasherculiani.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Plataforma de treino online i9: tudo o que vai ter lá dentro.\n\n📚 Artigos com fonte e linguagem simples\n🆓 Treinos gratuitos pra começar\n📋 Planos de treino com acompanhamento, assinados por profissional de Educação Física com CREF\n🥗 Nutrição com nutricionista (em breve)\n\nÉ pra quem tem rotina corrida, está começando ou voltando, e quer parar de treinar no achismo.\n\nA plataforma abre em breve. Quem está na lista VIP recebe a condição de fundador antes de todo mundo.\n\nManda I9 no direct e eu coloco seu nome na lista 💙\nQual dessas partes você mais quer usar? Comenta 👇\n\n#treinoonline #consultoriaonline #saude\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Texto alternativo:\u003c/strong> Carrossel apresentando a plataforma de treino i9 em um smartphone: artigos, treinos gratuitos, planos de treino assinados por profissional com CREF, nutrição em breve e lista VIP aberta.\u003c/p>\n"}],"19":[{"head":"(qui) 19h | REELS | Autoridade","title":"Dia Internacional do Homem: o que eu diria pro Lucas de 30","kind":"reels","luquinha":false,"html":"\u003cp>\u003cstrong>Gravação:\u003c/strong> câmera fixa, você sentado, luz lateral dura, fundo escuro. Edite em preto e branco com o laço azul como único elemento colorido no final. Fale devagar.\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> foto \u003ccode>1 (59).jpeg\u003c/code> | Título: \u003ccode>O QUE EU DIRIA PRO LUCAS DE 30\u003c/code> | Destaque: \u003ccode>30\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> &quot;três coisas&quot; no gancho cria contagem | preto e branco e fala lenta prendem pela emoção | o laço azul só aparece em cor no último segundo | final pensado para envio a outra pessoa.\u003c/p>\n\u003cp>\u003cstrong>Roteiro (40 s)\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tempo\u003c/th>\n\u003cth>Fala\u003c/th>\n\u003cth>Texto na tela\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0–3 s\u003c/td>\n\u003ctd>&quot;Se eu pudesse falar com o Lucas de 30 anos, eu diria três coisas.&quot;\u003c/td>\n\u003ctd>O QUE EU DIRIA PRO LUCAS DE 30\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3–13 s\u003c/td>\n\u003ctd>&quot;Primeira: para de treinar pra provar alguma coisa pros outros. Treina pra continuar treinando daqui a 30 anos.&quot;\u003c/td>\n\u003ctd>TREINA PRA CONTINUAR\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13–23 s\u003c/td>\n\u003ctd>&quot;Segunda: vai ao médico sem esperar doer. Check-up não é sinal de fraqueza.&quot;\u003c/td>\n\u003ctd>NÃO ESPERA DOER\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>23–33 s\u003c/td>\n\u003ctd>&quot;Terceira: treina perto de gente. Sozinho você vai rápido, mas desiste rápido também.&quot;\u003c/td>\n\u003ctd>TREINA PERTO DE GENTE\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>33–40 s\u003c/td>\n\u003ctd>&quot;Hoje é Dia Internacional do Homem. Manda esse vídeo pra um homem que você quer ver bem daqui a 30 anos.&quot;\u003c/td>\n\u003ctd>MANDA PRA ELE 💙\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Dia Internacional do Homem e Novembro Azul: 3 conselhos que eu daria pra mim mesmo aos 30.\n\n1. Treina pra continuar treinando daqui a 30 anos, não pra provar nada pra ninguém.\n2. Vai ao médico sem esperar doer.\n3. Treina perto de gente. Sozinho a gente vai rápido, mas desiste rápido também.\n\nCuidar da saúde não diminui ninguém. Pelo contrário.\n\nManda esse vídeo pra um homem que você quer ver bem daqui a 30 anos 💙\nE me conta: o que você diria pra você de 10 anos atrás?\n\n#novembroazul #saudedohomem #diadohomem\n\u003c/code>\u003c/pre>\n"}],"20":[{"head":"(sex) 11h | POST ÚNICO | Conversão | Layout B","title":"66 dias","kind":"post","luquinha":false,"html":"\u003cp>Feriado (Consciência Negra), por isso o horário da manhã.\u003c/p>\n\u003cp>\u003cstrong>Fotos:\u003c/strong> \u003ccode>1 (42).jpeg\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>Prompt ChatGPT\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nPost de feed quadrado 1:1, 1080x1080, Layout B (colorido), paleta NOVEMBRO AZUL, seguindo o Kit i9 do projeto.\n\nUse a foto anexada (1 (42).jpeg): a pessoa fazendo pose de força com os dois braços durante uma corrida, exatamente como está (IDENTITYLOCK: mesmo rosto, corpo e roupa). Recorte e posicione à direita, da cintura para cima.\nFundo: azul #1E8BFF chapado com textura sutil de papel.\nÀ esquerda, uma folha de calendário 3D grande, branca, com &quot;JANEIRO&quot; no topo em Montserrat Black e o dia &quot;25&quot; circulado à mão com pincel azul grosso. No canto inferior da folha, o logo i9 carimbado como um selo de tinta preta.\n\nTexto na parte superior (Montserrat Black, caixa alta, branco):\n&quot;66 DIAS&quot;\nEnorme, ocupando a largura do lado esquerdo.\nTexto de apoio (Montserrat SemiBold, branco, abaixo do calendário):\n&quot;Começando hoje, seu hábito fica automático em 25 de janeiro.&quot;\n\n@lucasherculiani pequeno no rodapé. Manter 140 px livres nas laterais.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Quanto tempo leva para criar um hábito de treino? Não são 21 dias.\n\nNum estudo da University College London (Lally e colaboradores, 2010), os participantes levaram em média 66 dias para que um novo hábito ficasse automático. Teve gente com 18 dias e gente com mais de 200. E pular um dia não estragou o processo.\n\nFaz a conta: começando hoje, 20/11, o seu dia 66 cai em 25 de janeiro. Quem espera a &quot;segunda-feira de janeiro&quot; chega no carnaval ainda brigando com a preguiça.\n\nDuas formas de começar comigo:\n👉 Presencial em Marília: manda TREINO no direct\n👉 Online, na plataforma i9: manda I9 no direct e entra na lista VIP\n\nSalva e marca quem vai começar com você 👇\n\n#habitos #treino #marilia\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Texto alternativo:\u003c/strong> Lucas Herculiani fazendo pose de força em uma corrida ao lado de uma folha de calendário de janeiro com o dia 25 circulado e o logo i9 carimbado, com o texto 66 dias.\u003c/p>\n"}],"21":[{"head":"(sáb) 11h | REELS | Nutrição avançada","title":"Respondendo a caixinha: 3 perguntas que dividem a academia","kind":"reels","luquinha":false,"html":"\u003cp>\u003cstrong>Antes:\u003c/strong> abra a caixinha de perguntas nos Stories de 17 a 20/11 com o tema &quot;a dúvida de treino que ninguém te respondeu direito&quot;. Use perguntas reais. As três abaixo já estão respondidas caso apareçam (ou algo parecido).\u003c/p>\n\u003cp>\u003cstrong>Gravação:\u003c/strong> print da pergunta na tela + você respondendo para a câmera, 10 s por resposta, com a fonte do estudo escrita embaixo.\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> foto \u003ccode>1 (3).jpg\u003c/code> | Título: \u003ccode>3 PERGUNTAS QUE DIVIDEM A ACADEMIA\u003c/code> | Destaque: \u003ccode>DIVIDEM\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> perguntas polêmicas em sequência (cada uma abre uma nova curiosidade) | resposta curta e direta, sem enrolação | &quot;a terceira é a que mais me perguntam&quot; no gancho, para segurar até o fim.\u003c/p>\n\u003cp>\u003cstrong>Roteiro (35 s)\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tempo\u003c/th>\n\u003cth>Pergunta na tela\u003c/th>\n\u003cth>Resposta\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0–2 s\u003c/td>\n\u003ctd>3 PERGUNTAS QUE DIVIDEM A ACADEMIA\u003c/td>\n\u003ctd>&quot;Três perguntas da caixinha. A terceira é a que mais me fazem.&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2–12 s\u003c/td>\n\u003ctd>&quot;Cardio em jejum queima mais gordura?&quot;\u003c/td>\n\u003ctd>&quot;Num estudo de 2014, quem treinou em jejum e quem treinou alimentado perdeu a mesma gordura, com a mesma dieta. O que manda é o balanço do dia, não o horário.&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>12–22 s\u003c/td>\n\u003ctd>&quot;Quantas séries por semana pra crescer?&quot;\u003c/td>\n\u003ctd>&quot;A meta-análise de dose-resposta de 2017 mostrou mais hipertrofia com dez ou mais séries semanais por músculo do que com menos de cinco.&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>22–32 s\u003c/td>\n\u003ctd>&quot;Creatina faz mal pro rim?&quot;\u003c/td>\n\u003ctd>&quot;Em pessoas saudáveis, nas doses recomendadas, a revisão da Sociedade Internacional de Nutrição Esportiva não encontrou evidência de dano. Tem problema renal? Médico antes.&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>32–35 s\u003c/td>\n\u003ctd>MANDA A PRÓXIMA\u003c/td>\n\u003ctd>&quot;Próxima caixinha é terça.&quot;\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Cardio em jejum, volume de treino e creatina: respondi 3 perguntas que sempre geram briga na academia.\n\n❓ Cardio em jejum queima mais gordura?\nNum estudo de Schoenfeld e colaboradores (2014), com dieta igual, treinar em jejum ou alimentado deu a mesma perda de gordura.\n\n❓ Quantas séries por semana pra ganhar músculo?\nA meta-análise de dose-resposta de 2017 (Schoenfeld, Ogborn e Krieger) encontrou mais hipertrofia com 10 ou mais séries semanais por grupo muscular.\n\n❓ Creatina faz mal pro rim?\nEm pessoas saudáveis e nas doses recomendadas, a posição da International Society of Sports Nutrition (2017) não aponta dano. Quem tem doença renal precisa de avaliação médica.\n\nNão é prescrição individual. É o que a pesquisa mostra para você conversar com o seu profissional.\n\nQual pergunta polêmica eu respondo no próximo? Deixa aqui 👇\n\n#musculacao #creatina #hipertrofia\n\u003c/code>\u003c/pre>\n"}],"23":[{"head":"(seg) 19h | REELS | Atração","title":"A dose mínima: o menor treino que ainda funciona","kind":"reels","luquinha":false,"html":"\u003cp>\u003cstrong>Gravação:\u003c/strong> cronômetro grande na tela durante o vídeo todo. Abre com você olhando o relógio e fechando a mochila com pressa. Depois, fala para a câmera em cortes rápidos.\u003c/p>\n\u003cp>\u003cstrong>Capa:\u003c/strong> foto \u003ccode>1 (2).jpeg\u003c/code> | Título: \u003ccode>O MENOR TREINO QUE FUNCIONA\u003c/code> | Destaque: \u003ccode>MENOR\u003c/code> | Paleta: NOVEMBRO AZUL\u003c/p>\n\u003cp>\u003cstrong>Retenção:\u003c/strong> promessa de curiosidade (&quot;menos do que você imagina&quot;) | dois números inesperados em sequência (1 série; 1/9 do volume) | a diferença entre jovens e 60+ no final, que gera compartilhamento.\u003c/p>\n\u003cp>\u003cstrong>Roteiro (33 s)\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tempo\u003c/th>\n\u003cth>Fala\u003c/th>\n\u003cth>Texto na tela\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0–3 s\u003c/td>\n\u003ctd>&quot;Pesquisadores calcularam o mínimo de treino pra ficar mais forte. É menos do que você imagina.&quot;\u003c/td>\n\u003ctd>O MÍNIMO QUE FUNCIONA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3–13 s\u003c/td>\n\u003ctd>&quot;Uma revisão de 2020 mostrou que, em homens treinados, uma série de seis a doze repetições, perto da falha, duas a três vezes por semana, já trouxe ganho de força relevante.&quot;\u003c/td>\n\u003ctd>1 SÉRIE • 2-3X/SEMANA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13–23 s\u003c/td>\n\u003ctd>&quot;E pra manter? Num estudo de 2011, jovens mantiveram o músculo treinando com um nono do volume original.&quot;\u003c/td>\n\u003ctd>MANTER: 1/9 DO VOLUME\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>23–29 s\u003c/td>\n\u003ctd>&quot;Mas quem tinha mais de sessenta precisou de um terço. Com a idade, o mínimo sobe.&quot;\u003c/td>\n\u003ctd>60+: 1/3 DO VOLUME\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>29–33 s\u003c/td>\n\u003ctd>&quot;Semana corrida não é desculpa pra zerar. Na i9 vai ter treino montado pra isso. Manda I9 no direct.&quot;\u003c/td>\n\u003ctd>MANDA &quot;I9&quot; NO DIRECT\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Legenda\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Treino para quem não tem tempo: o que a ciência diz sobre a dose mínima que ainda funciona.\n\n⏱ Uma revisão de 2020 (Androulakis-Korakakis e colaboradores) mostrou que, em homens treinados, uma série de 6 a 12 repetições perto da falha, 2 a 3 vezes por semana, já trouxe ganhos de força relevantes.\n\n🔁 Para manter: num estudo de Bickel e colaboradores (2011), adultos jovens mantiveram o ganho muscular com 1/9 do volume de treino. Os participantes com mais de 60 anos precisaram de 1/3.\n\nOu seja: semana corrida pede treino menor, não treino zero. E, com a idade, o mínimo sobe.\n\nNa i9 vai ter treino curto, montado por profissional de Educação Física, pra essas semanas.\nManda I9 no direct e entra na lista VIP antes da Black Friday 💙\n\n#treinorapido #treinodeforca #musculacao\n\u003c/code>\u003c/pre>\n"}],"24":[{"head":"(ter) 19h | CARROSSEL 7 slides | Conversão | Layout A","title":"5 mitos que te fazem perder anos de treino","kind":"carrossel","luquinha":false,"html":"\u003cp>\u003cstrong>Promessa do carrossel:\u003c/strong> derrubar 5 crenças de academia com estudo na mão. É o carrossel que a pessoa salva para ganhar discussão e manda no grupo da academia.\u003c/p>\n\u003cp>\u003cstrong>Fotos:\u003c/strong> capa \u003ccode>1 (51).jpeg\u003c/code> | slide 7 \u003ccode>1 (12).jpeg\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>Prompt slide 1 (capa)\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>IDENTITYLOCK\nCarrossel de 7 slides para o feed, todos quadrados 1:1, 1080x1080, Layout A (escuro), paleta NOVEMBRO AZUL, seguindo o Kit i9 do projeto. Este é o SLIDE 1 (capa). Mantenha o mesmo estilo em todos os próximos slides.\n\nUse a foto anexada (1 (51).jpeg): a pessoa agachada na grama fazendo gesto de &quot;sei lá&quot; com as mãos, exatamente como está (IDENTITYLOCK: mesmo rosto, expressão, corpo e roupa). Posicione no centro-direita, corpo inteiro. Troque o fundo por grafite escuro com luz azul de recorte.\nAo redor dele, 5 balões de fala brancos pequenos, cada um riscado por um X azul neon.\nNo chão, ao lado do pé dele, uma marca de mão de magnésio branco com o formato do logo i9 desenhado no pó.\n\nTexto na parte superior (Montserrat Black, caixa alta, branco):\n&quot;5 MITOS QUE TE FAZEM PERDER ANOS DE TREINO&quot;\nA palavra &quot;ANOS&quot; em azul #1E8BFF.\n\nPequena seta azul e &quot;arrasta&quot; o colecionável, cabeça grande, cabelo cacheado castanho-escuro, barba curta, olhos claros, rosto redondo, físico forte, camiseta preta com o logo i9 no peito, short preto, tênis preto e rosa, smartwatch e pulseira rosa com checks brancos. Mantenha rosto, cabelo, proporções e roupa idênticos.\n\nVídeo vertical 9:16, 10 segundos, animação 3D cinematográfica.\nCena: cozinha de manhã cedo, luz dourada entrando pela janela. LUQUINHA de mochila nas costas, segurando uma garrafa de água.\n0–4 s: ele dá um gole grande na garrafa e fecha com determinação.\n4–7 s: coloca a garrafa na mochila e ajusta as alças.\n7–10 s: olha para a câmera, faz sinal de &quot;vem&quot; com a cabeça e fala.\nFala (português do Brasil, voz masculina adulta, animada): &quot;Bom dia, parceiro! Segunda-feira é dia de aparecer. Bora!&quot;\nCâmera: plano médio fixo.\nÁudio: passarinhos, som de garrafa, música animada leve.\nSem legendas, sem texto na tela, sem marcas d&#39;água.\n\u003c/code>\u003c/pre>\n"},"L2":{"title":"Tá chovendo? Bora treinar! (usar em dia de chuva)","html":"\u003cpre>\u003ccode>IDENTITYLOCK\nUse a imagem anexada (luquinha.png) como referência exata do personagem LUQUINHA: mascote 3D estilo boneco colecionável, cabeça grande, cabelo cacheado castanho-escuro, barba curta, olhos claros, rosto redondo, físico forte, camiseta preta com o logo i9 no peito, short preto, tênis preto e rosa, smartwatch e pulseira rosa com checks brancos. Mantenha rosto, cabelo, proporções e roupa idênticos.\n\nVídeo vertical 9:16, 10 segundos, animação 3D cinematográfica.\nCena: entrada de uma academia à noite, chuva forte do lado de fora, relâmpago iluminando o céu.\n0–3 s: LUQUINHA chega correndo da chuva, para debaixo da marquise e chacoalha o cabelo cacheado molhado, espirrando água.\n3–6 s: um relâmpago clareia tudo. Ele olha para fora, depois para a câmera, com cara de desafio.\n6–10 s: abre um sorriso confiante e fala, entrando na academia.\nFala (português do Brasil, voz masculina adulta, animad
