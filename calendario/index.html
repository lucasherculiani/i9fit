<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="calendario-versao" content="2026-11-05T16:21:19.532Z">
<title>Calendários de clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: mural de clientes — um quadro por cliente, faixa na cor da campanha do mês */
:root {
  --bg: #0a0b0d;
  --surface: #13151a;
  --surface-2: #1b1e25;
  --line: #262a33;
  --fg: #f1f3f6;
  --muted: #9aa1ad;
  --accent: #C8F542;
  --font-display: "Montserrat", "Arial Black", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eaeef4; --line: #d7dde6; --fg: #10141a; --muted: #586170; --accent: #5F8A0C; color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 30px 22px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.eyebrow { font: 800 12px var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { font: 900 clamp(28px, 5vw, 42px)/1.05 var(--font-display); margin: 6px 0 0; text-wrap: balance; }
.count { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.search { font: 600 15px var(--font-body); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 0; width: 280px; max-width: 100%; }
.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding-block: 0 60px; }
.client { position: relative; display: flex; flex-direction: column; gap: 6px; min-height: 190px; padding: 22px 20px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--fg); text-decoration: none; overflow: hidden; }
.client::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--c, var(--accent)); }
.client:hover { border-color: var(--c, var(--accent)); transform: translateY(-2px); }
.client:focus-visible { outline: 2px solid var(--c, var(--accent)); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) { .client { transition: transform .15s ease, border-color .15s ease; } }
.client .name { font: 900 21px/1.15 var(--font-display); text-wrap: balance; }
.client .ig { color: var(--muted); font-size: 14px; }
.client .month { align-self: flex-start; margin-top: 6px; font: 800 12px var(--font-display); letter-spacing: .08em; text-transform: uppercase; background: var(--c, var(--accent)); color: #0b0b0b; padding: 4px 10px; border-radius: 6px; }
.client .sub { font-size: 14.5px; }
.client .stats { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px 14px; font: 700 13px var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 10px; }
.client .open { font: 800 13px var(--font-display); color: var(--c, var(--accent)); }
.empty { color: var(--muted); padding: 40px 0; }
.card-wrap { position: relative; display: flex; }
.card-wrap .client { flex: 1; }
.del { position: absolute; top: 14px; right: 12px; z-index: 2; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: pointer; }
.del:hover, .del:focus-visible { color: #ff6b6b; border-color: #ff6b6b; outline: none; }
.del svg { width: 17px; height: 17px; }
.client .name { padding-right: 34px; }
.hidden-box { padding-block: 0 50px; }
.hidden-box summary { cursor: pointer; color: var(--muted); font: 800 13px var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.hidden-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.hidden-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.hidden-item span { font-weight: 700; }
.btn { font: 800 13px var(--font-display); border-radius: 9px; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
.btn.danger { background: #d93a3a; border-color: #d93a3a; color: #fff; }
.btn.ok { background: var(--accent); border-color: var(--accent); color: #0b0b0b; }
dialog { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 22px; width: min(400px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog h2 { font: 900 20px/1.2 var(--font-display); margin: 0 0 8px; }
dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14.5px; }
dialog input { width: 100%; font: 600 15px var(--font-body); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
dialog .err { color: #ff6b6b; font-size: 13.5px; min-height: 20px; margin: 0 0 6px; }
dialog .acts { display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 10; }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">@lucasherculiani · i9</div>
      <h1>Calendários de clientes</h1>
      <p class="count" id="count"></p>
    </div>
    <input class="search" id="search" type="search" placeholder="Buscar cliente" aria-label="Buscar cliente" hidden>
  </header>
  <main class="grid" id="grid"></main>
  <details class="hidden-box" id="hiddenBox" hidden>
    <summary id="hiddenSum">Excluídos</summary>
    <div class="hidden-list" id="hiddenList"></div>
  </details>
</div>
<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgText"></p>
  <input id="dlgPass" type="password" placeholder="Senha do treinador" autocomplete="current-password">
  <p class="err" id="dlgErr"></p>
  <div class="acts"><button class="btn" id="dlgCancel" type="button">Cancelar</button><button class="btn danger" id="dlgOk" type="button">Excluir</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<footer><div class="wrap">Página interna, não indexada.</div></footer>
<script type="module">
// Exclusão de clientes: a lista de excluídos fica no Firestore (sistema/calendario_ocultos),
// assim o cliente some da página para todos, e pode ser restaurado.
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
var CLIENTES = [{"slug":"quiropraxia","cliente":"Évora de Souza | Quiropraxia","instagram":"@quiropraxiaoficial","subtitulo":"Coluna sem achismo · 2 posts por semana","ano":2026,"mes":11,"mesNome":"novembro","cor":"#3FC1B0","corClaro":"#0E6B66","mascote":"","posts":9,"stories":13,"repositorio":"lucasherculiani/i9fit","atualizado":"2026-11-05T16:07:42.932Z"},{"slug":"jucimara-firmino","cliente":"Jucimara Firmino","instagram":"@jucimara_firmino","subtitulo":"5/nov a 3/dez","ano":2026,"mes":11,"mesNome":"novembro","cor":"#FF3EA5","corClaro":"#C4126F","mascote":"","posts":9,"stories":15,"repositorio":"lucasherculiani/i9fit","atualizado":"2026-11-05T12:00:00.000Z"},{"slug":"lucas-herculiani","cliente":"Lucas Herculiani","instagram":"@lucasherculiani","subtitulo":"Novembro Azul","ano":2026,"mes":11,"mesNome":"novembro","cor":"#1E8BFF","corClaro":"#0A62C4","mascote":"LUQUINHA","posts":22,"stories":127,"repositorio":"lucasherculiani/i9fit","atualizado":"2026-11-03T11:18:30.362Z"},{"slug":"rej-mercado","cliente":"R&J Mercado","instagram":"@rejmercadomarilia","subtitulo":"Novembro em azul · 23 a 28 em preto","ano":2026,"mes":11,"mesNome":"novembro","cor":"#5EB8FF","corClaro":"#1E5BD8","mascote":"","posts":28,"stories":164,"repositorio":"lucasherculiani/i9fit","atualizado":"2026-11-03T12:36:30.674Z"}];
var SENHA = "admin123";
var fb = initializeApp({ apiKey: "AIzaSyC6xUfFJ59fXT1_eR1HDD7UPiQ8aakSkHY", authDomain: "i9fit-4b643.firebaseapp.com", projectId: "i9fit-4b643", storageBucket: "i9fit-4b643.firebasestorage.app", messagingSenderId: "60375557935", appId: "1:60375557935:web:b761c243672d50c7c263da" }, "calendario");
var REF = doc(getFirestore(fb), "sistema", "calendario_ocultos");
var ocultos = [];
var $ = function (id) { return document.getElementById(id); };
var grid = $("grid"), search = $("search"), count = $("count");
var LIXO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function cap(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
function fmt(iso) { var d = new Date(iso); return isNaN(d) ? "" : ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2); }
function toast(t) { var el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = "none"; }, 3200); }
function visiveis() { return CLIENTES.filter(function (c) { return ocultos.indexOf(c.slug) < 0; }); }
function render(q) {
  q = (q || "").toLowerCase();
  var base = visiveis();
  var list = base.filter(function (c) { return !q || (c.cliente + " " + c.instagram + " " + c.subtitulo).toLowerCase().indexOf(q) > -1; });
  count.textContent = base.length === 1 ? "1 cliente" : base.length + " clientes";
  grid.innerHTML = "";
  if (!list.length) grid.innerHTML = '<p class="empty">' + (base.length ? "Nenhum cliente com esse nome." : "Nenhum calendário publicado ainda.") + "</p>";
  list.forEach(function (c) {
    var w = document.createElement("div"); w.className = "card-wrap";
    var a = document.createElement("a");
    a.className = "client"; a.href = "./" + encodeURIComponent(c.slug) + "/";
    a.style.setProperty("--c", c.cor);
    a.innerHTML =
      '<span class="name">' + esc(c.cliente) + "</span>" +
      '<span class="ig">' + esc(c.instagram) + "</span>" +
      '<span class="month">' + esc(cap(c.mesNome)) + " " + c.ano + "</span>" +
      (c.subtitulo ? '<span class="sub">' + esc(c.subtitulo) + "</span>" : "") +
      '<span class="stats"><span>' + c.posts + " posts</span><span>" + c.stories + " stories</span>" +
      (fmt(c.atualizado) ? "<span>atualizado " + fmt(c.atualizado) + "</span>" : "") + "</span>" +
      '<span class="open">Abrir calendário →</span>';
    a.setAttribute("aria-label", c.cliente + ", calendário de " + c.mesNome + " de " + c.ano);
    var del = document.createElement("button");
    del.type = "button"; del.className = "del"; del.innerHTML = LIXO;
    del.title = "Excluir cliente"; del.setAttribute("aria-label", "Excluir " + c.cliente);
    del.addEventListener("click", function () { pedir("excluir", c); });
    w.appendChild(a); w.appendChild(del); grid.appendChild(w);
  });
  var exc = CLIENTES.filter(function (c) { return ocultos.indexOf(c.slug) > -1; });
  $("hiddenBox").hidden = !exc.length;
  $("hiddenSum").textContent = "Excluídos (" + exc.length + ")";
  $("hiddenList").innerHTML = "";
  exc.forEach(function (c) {
    var it = document.createElement("div"); it.className = "hidden-item";
    it.innerHTML = "<span>" + esc(c.cliente) + "</span>";
    var b = document.createElement("button"); b.type = "button"; b.className = "btn ok"; b.textContent = "Restaurar";
    b.addEventListener("click", function () { pedir("restaurar", c); });
    it.appendChild(b); $("hiddenList").appendChild(it);
  });
  search.hidden = base.length <= 6;
}
var acao = null;
function liberado() { try { return sessionStorage.getItem("cal_admin") === "1"; } catch (e) { return false; } }
function pedir(tipo, c) {
  acao = { tipo: tipo, c: c };
  var exc = tipo === "excluir";
  $("dlgTitle").textContent = (exc ? "Excluir " : "Restaurar ") + c.cliente + "?";
  $("dlgText").textContent = exc ? "O cliente sai da lista de calendários. Dá para restaurar depois em “Excluídos”." : "O cliente volta para a lista de calendários.";
  $("dlgOk").textContent = exc ? "Excluir" : "Restaurar";
  $("dlgOk").className = "btn " + (exc ? "danger" : "ok");
  $("dlgPass").value = ""; $("dlgPass").hidden = liberado(); $("dlgErr").textContent = "";
  $("dlg").showModal();
  if (!liberado()) $("dlgPass").focus();
}
async function confirmar() {
  if (!acao) return;
  if (!liberado()) {
    if ($("dlgPass").value !== SENHA) { $("dlgErr").textContent = "Senha incorreta."; return; }
    try { sessionStorage.setItem("cal_admin", "1"); } catch (e) {}
  }
  var c = acao.c, exc = acao.tipo === "excluir";
  $("dlgOk").disabled = true;
  try {
    await setDoc(REF, { slugs: exc ? arrayUnion(c.slug) : arrayRemove(c.slug) }, { merge: true });
    if (exc) { if (ocultos.indexOf(c.slug) < 0) ocultos.push(c.slug); }
    else ocultos = ocultos.filter(function (s) { return s !== c.slug; });
    $("dlg").close(); render(search.value);
    toast(exc ? c.cliente + " excluído." : c.cliente + " restaurado.");
  } catch (err) {
    console.error(err); $("dlgErr").textContent = "Não foi possível salvar. Verifique a internet e tente de novo.";
  } finally { $("dlgOk").disabled = false; }
}
$("dlgOk").addEventListener("click", confirmar);
$("dlgPass").addEventListener("keydown", function (e) { if (e.key === "Enter") confirmar(); });
$("dlgCancel").addEventListener("click", function () { $("dlg").close(); });
search.addEventListener("input", function () { render(search.value); });
render("");
getDoc(REF).then(function (snap) {
  ocultos = (snap.exists() && Array.isArray(snap.data().slugs)) ? snap.data().slugs : [];
  render(search.value);
}).catch(function (err) { console.warn("Lista de excluídos indisponível:", err); });
</script>
</body>
</html>
